[build]
  command = "npm run build:netlify"
  publish = "dist/netlify-site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/collections/:id"
  to = "/collections/:id/"
  status = 301

[[edge_functions]]
  path = "/health/*"
  function = "health-basic-auth"

[[edge_functions]]
  path = "/data/health.json"
  function = "health-basic-auth"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/images/collections/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/updates/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/data/health.json"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/catalog-skill-urls.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/connect"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/app/connect"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/data/index.html"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/data/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/skills/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/skills/*/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/library/*/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/collections/*/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/developers/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/llms-gold.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=300, must-revalidate"
