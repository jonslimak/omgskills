<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml" />
    <meta name="referrer" content="no-referrer" />
    <!-- Transitional app shell: keep /app and app.omgskills.com out of search results.
         Static library pages and the future homepage must not reuse this tag. -->
    <meta name="robots" content="noindex, follow" />
    <title>omgskills</title>
    <!-- Paint the loading screen in the saved theme (src/app/unified/theme-preference.ts), so dark mode never flashes white. -->
    <script>
      (function () {
        var theme = "";
        try { theme = localStorage.getItem("omgskills-theme") || localStorage.getItem("omgskills-home-theme") || ""; } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          try { theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { theme = "light"; }
        }
        document.documentElement.dataset.uaTheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/src/app/loading.css" />
  </head>
  <body>
    <div id="root"><div class="portal-loading" role="status" aria-label="Loading omgskills"><span class="portal-loading-spinner" aria-hidden="true"></span></div></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
