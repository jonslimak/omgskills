<!doctype html>
<html lang="en">

    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --soft: #f5f5f7; --blue: #0071e3; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --soft: #1c1c1e; --blue: #2997ff; --bg: #000000; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); line-height: 1.5; }
    header, main { max-width: 640px; margin: 0 auto; padding: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: inherit; font-weight: 700; text-decoration: none; }
    main { padding-top: 12vh; }
    h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 10px; }
    p { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; min-width: 0; height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); color: inherit; font: inherit; }
    button { height: 42px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--blue); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
    nav a { color: var(--blue); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
  </style>
</head>

      <input type="search" name="q" placeholder="Search skills" aria-label="Search skills" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <nav aria-label="Helpful links">
      <a href="/app/library/">Discover skills</a>
      <a href="/app/library/trending/">Trending</a>
      <a href="/app/library/creators/">Creators</a>

</body>
</html>
