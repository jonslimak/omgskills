<style>

  .plate { position: relative; }
  #line { display: block; width: 100%; }
  .caption {
    position: absolute; right: 1%; top: 4%; text-align: right; align-items: flex-end;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transition: opacity 300ms ease;
    pointer-events: none;
  }
  .caption.on { opacity: 1; }
  .caption .idx { font: 500 11px/1 var(--mono); letter-spacing: 0.12em; color: var(--muted); }
  .caption .txt { font: 200 clamp(18px, 2.4vw, 28px)/1.15 var(--display); letter-spacing: -0.01em; color: var(--caption); }
  @media (max-width: 620px) {
    .caption { position: static; margin-top: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .caption { transition: none; } }
</style>

  // ---- The four moves
  const PUBLIC = ["grill-me", "napkin", "gstack", "mcp-builder", "swiftdata-pro", "humanizer"];
  let pi = 0;
  function discover(routes) {

    if (!m) return;

  function create(id, name, routes) {

    m.scale = 0.1; m.tag = true; m.mt = 0; m.agent = a; m.next = routes;

  function update(name) {

    pulse([[a.x, BOWL_Y], [a.x, onLine(RETURN, a.x)], [LIFT.x, LIFT.bottom], [LIFT.x, LIFT.top], FEED[1], [WHEEL.x, WHEEL.y]], () => {
      note(you, "updated", 2.6); ripple(WHEEL.x, WHEEL.y, WHEEL.r + 30, 1.3);

        pulse([[WHEEL.x, WHEEL.y + WHEEL.r], FUNNEL, start, [b.x, onLine(b.track, b.x)], [b.x, BOWL_Y]], () => { note(b, "synced", 2.4); ripple(b.x, BOWL_Y - 4, 34); });

  function pulse(pts, onEnd) { pulses.push({ path: mkPath(pts), d: 0, onEnd }); }

  const PHRASES = ["Discover trusted public skills", "Manage the skills you make", "Share skills with your team", "Update once & stay in sync."];
  let capTimer = 0, capSwap = 0;
  function caption(i) {
    clearTimeout(capTimer); clearTimeout(capSwap);
    const set = () => { capEl.querySelector(".idx").textContent = `0${i + 1} / 04`; capEl.querySelector(".txt").textContent = PHRASES[i]; capEl.classList.add("on"); };

  const CYCLE = 32;
  const EVENTS = [

    [3.5, () => discover(["pk", "wc"])],
    [9.0, () => { caption(1); create("pc", "release-notes", ["wh", "wc"]); }],
    [17.0, () => { caption(2); create("team", "canvas-design", ["wc"]); const r = gondolas.find((g) => g && g.name === "release-notes"); if (r) r.routes.push("team"); }],

  let tc = 0, ei = 0, clock = 0;

    gate.open = Math.max(0, gate.open - dt * 2.2);
    for (const o of [...Object.values(AGENTS), you]) {

  // ---- Drawing
  // A rail under a stretch of marble path: two lines a marble's radius below the centre line
  function rail(a, b, gaps = []) {
    const off = R + 1.5;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (Math.abs(dx) < 1) { // vertical chute or lift: walls either side

      return;
    }
    const segs = [[a[0], b[0]]];
    for (const g of gaps) { const last = segs.pop(); segs.push([last[0], g - 12], [g + 12, last[1]]); }

    poly([[t[0][0], t[0][1]], [t[0][0] + DX, t[0][1] + DY], [t[1][0] + DX, t[1][1] + DY], [t[1][0], t[1][1]]], "paper");

  function drawBin() {

    ctx.save(); ctx.beginPath(); ctx.rect(BIN.x, BIN.y - 20, BIN.w, BIN.h + 20); ctx.clip();

    ctx.restore();
  }
  function drawBinFront() { poly([[BIN.x, BIN.y + 14], [BIN.x + BIN.w, BIN.y + 14], [BIN.x + BIN.w, BIN.y + BIN.h], [BIN.x, BIN.y + BIN.h]], "paper"); }
  function drawWheelBack() {
    const { x, y, r } = WHEEL;
    // A-frame stand
    line([x, y], [x - 70, y + 118]); line([x, y], [x + 70, y + 118]);
    line([x - 70 + DX, y + 118 + DY], [x + DX, y + DY]); line([x + 70 + DX, y + 118 + DY], [x + DX, y + DY]);
    ctx.beginPath(); ctx.arc(x + DX, y + DY, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r - 5, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < WHEEL.n; i++) { const [px, py] = pivot(i); line([x + (px - x) * 0.28, y + (py - y) * 0.28], [px, py]); }
    circle(x, y, 24, you.flash > 0.4 ? "ink" : "paper");
    text("YOU", x, y + 4, { size: 11, weight: 500, align: "center", color: you.flash > 0.4 ? paper : ink, spacing: "0.12em" });
  }
  function drawGondolas() {
    for (let i = 0; i < WHEEL.n; i++) {
      const [px, py] = pivot(i);
      circle(px, py, 2.6, "paper");
      line([px, py], [px, py + 3]);
      ctx.beginPath(); ctx.arc(px, py + 13, R + 3, 0.1, Math.PI - 0.1); ctx.stroke();

  function drawFunnel() {
    poly([[FUNNEL[0] - 22, FUNNEL[1] - 18], [FUNNEL[0] + 22, FUNNEL[1] - 18], [FUNNEL[0] + 11, FUNNEL[1] + 4], [FUNNEL[0] - 11, FUNNEL[1] + 4]], "paper");
    line([FUNNEL[0] - 11, FUNNEL[1] + 4], [FUNNEL[0] - 11, FUNNEL[1] + 10]); line([FUNNEL[0] + 11, FUNNEL[1] + 4], [FUNNEL[0] + 11, FUNNEL[1] + 10]);
  }
  function drawLift() {
    const x = LIFT.x;
    line([x - 13, LIFT.top - 10], [x - 13, LIFT.bottom + 6]); line([x + 13, LIFT.top - 10], [x + 13, LIFT.bottom + 6]);
    circle(x, LIFT.top - 10, 9, "paper"); circle(x, LIFT.bottom + 6, 9, "paper");

  function drawAgent(a, id) {

    const cx = a.x, cy = PED.top - 2;
    if (a.logo) logo(a.logo, cx, PED.top + 17, 16, lit ? "paper" : "ink");
    else text("@", cx, PED.top + 22, { size: 16, weight: 500, align: "center", color: lit ? paper : ink });
    text(a.name, cx, PED.top + 38, { size: 8.5, weight: 500, align: "center", color: lit ? paper : ink });

  }
  function drawBowlBack(a) {
    const cx = a.x, cy = PED.top - 2;

    ctx.beginPath(); ctx.moveTo(cx - 30, cy - 8); ctx.quadraticCurveTo(cx - 30, cy + 6, cx - 18, cy + 6); ctx.lineTo(cx + 18, cy + 6); ctx.quadraticCurveTo(cx + 30, cy + 6, cx + 30, cy - 8); fillAs("paper"); ctx.stroke();
  }
  function callout(ax, ay, dx, dy, l1, l2) {
    const ex = ax + dx, ey = ay + dy;

    ctx.font = `500 10.5px ${MONO}`; const w1 = ctx.measureText(l1).width;
    ctx.font = `400 10px ${MONO}`; const w2 = l2 ? ctx.measureText(l2).width : 0;

  function draw() {

    ctx.fillStyle = paper; ctx.fillRect(0, 0, VW, VH);

    callout(208, 26, 30, -8, "PUBLIC SKILLS", "a stream of trusted skills");
    callout(GATE + 12, onLine(STREAM, GATE + 12) + 12, 40, 30, "YOUR PICK", "the gate drops it to you");
    callout(BIN.x + BIN.w + DX, BIN.y + 8, 22, -26, "THE REST", "roll on by");
    const held = gondolas.filter((g) => g && g.state === "ride").length;
    callout(WHEEL.x - WHEEL.r * 0.7, WHEEL.y - WHEEL.r * 0.7, -70, -40, "YOUR SKILLS", you.note || `${plural(held, "skill")} · 4 agents`);
    callout(LIFT.x + 13, LIFT.top + 40, 34, 14, "LIFT", "back to you");
    for (const a of Object.values(AGENTS)) if (a.note) text(a.note, a.x, PED.top + PED.h + 14, { size: 10, color: muted, align: "center" });

  // ---- Fit to the banner width
  function layout() {
