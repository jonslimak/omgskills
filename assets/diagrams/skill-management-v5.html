    opacity: 0; transition: opacity 300ms ease;
    pointer-events: none;

</style>

    poly([P(st.x - 0.6, st.y - 0.6, st.h), P(st.x + 0.6, st.y - 0.6, st.h), P(st.x + 0.6, st.y + 0.6, st.h), P(st.x - 0.6, st.y + 0.6, st.h)], "ink");
    poly([P(x + 0.35, fy, 0.35), P(x + 2.25, fy, 0.35), P(x + 2.25, fy, 1.6), P(x + 0.35, fy, 1.6)], lit ? "ink" : "paper");
    faceLogo(st.logo, st.x, fy, 0.975, 0.85, lit ? "paper" : "ink");
  }
  function drawPacket(p) {
    const s = PK * p.scale; let z = p.z, h = s;
    if (p.state === "sink") { z = Math.max(p.z, p.floor); h = p.z + PK - z; if (h <= 0.02) return; }
    ctx.globalAlpha = Math.max(0, p.alpha);
    const [t, l, r] = STYLE[p.kind];
    rbox(p.x, p.y, z, s, h, p.ang, t, l, r);
    ctx.globalAlpha = 1;
  }
  function ik(a) {
    const b = a.base, T = a.pos, dx = T[0] - b[0], dy = T[1] - b[1], dz = T[2] - b[2];
    const d = Math.hypot(dx, dy), L = a.L, D = Math.min(Math.hypot(d, dz), 2 * L - 1e-3);
    const ang = Math.atan2(dz, d) + Math.acos(D / (2 * L));
    return [b[0] + Math.cos(a.yaw) * Math.cos(ang) * L, b[1] + Math.sin(a.yaw) * Math.cos(ang) * L, b[2] + Math.sin(ang) * L];
  }
  function drawArm(a) {
    const k = S / 24, E = ik(a), W3 = a.pos, H3 = [W3[0], W3[1], W3[2] - 0.12];
    const B = P(...a.base), Ep = P(...E), Wp = P(...W3);
    tube(B, Ep, 8 * k); tube(Ep, Wp, 7 * k);
    joint(B, 4.6 * k); joint(Ep, 3.8 * k);
    if (a.carry) drawPacket(a.carry);
    // gripper: a bar across the wrist with two fingers that close around the lid
    const px = -Math.sin(a.yaw) * 0.55, py = Math.cos(a.yaw) * 0.55, fz = H3[2] - GRIP - 0.32;
    const l = [H3[0] - px, H3[1] - py], r = [H3[0] + px, H3[1] + py];
    ctx.save(); ctx.lineWidth = 2.2 * LW;
    line(P(l[0], l[1], H3[2]), P(r[0], r[1], H3[2]));
    line(P(l[0], l[1], H3[2]), P(l[0], l[1], fz)); line(P(r[0], r[1], H3[2]), P(r[0], r[1], fz));
    ctx.restore();
    joint(Wp, 3.2 * k);
  }

  // Leader-line label in the manner of a technical drawing
  function callout(anchor, dx, dy, l1, l2) {
    const k = S / 24, f1 = Math.max(8, Math.min(12, 10.5 * k)), f2 = f1 - 0.5;
    const ex = anchor[0] + dx * k, ey = anchor[1] + dy * k;
    ctx.save();
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0.08em";
    ctx.font = `500 ${f1}px ${MONO}`; const w1 = ctx.measureText(l1).width;
    ctx.font = `400 ${f2}px ${MONO}`; const w2 = ctx.measureText(l2).width;
    const w = Math.max(w1, w2) + 6, right = dx >= 0, sx = right ? ex + w : ex - w;
    ctx.lineWidth = Math.max(0.7, LW * 0.8);
    ctx.beginPath(); ctx.moveTo(anchor[0], anchor[1]); ctx.lineTo(ex, ey); ctx.lineTo(sx, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(anchor[0], anchor[1], 1.9 * Math.max(1, k), 0, Math.PI * 2); ctx.fillStyle = ink; ctx.fill();
    ctx.textAlign = right ? "left" : "right";
    const tx = right ? ex + 3 : ex - 3;
    ctx.fillStyle = ink; ctx.font = `500 ${f1}px ${MONO}`; ctx.fillText(l1, tx, ey - 4 * Math.max(0.8, k));
    ctx.fillStyle = muted; ctx.font = `400 ${f2}px ${MONO}`; ctx.fillText(l2, tx, ey + f2 + 2);
    ctx.restore();
  }
  function tagFor(p) {
    const k = S / 24, top = P(p.x, p.y, p.z + PK * p.scale + 0.1), y1 = top[1] - 16 * k;
    ctx.save(); ctx.lineWidth = Math.max(0.7, LW * 0.8);
    line(top, [top[0], y1]);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0.02em";
    ctx.font = `400 ${Math.max(8, Math.min(11, 10 * k))}px ${MONO}`; ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = paper; ctx.strokeText(p.name, top[0], y1 - 4);
    ctx.fillStyle = ink; ctx.fillText(p.name, top[0], y1 - 4);
    ctx.restore();
  }
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const ringCount = (arr) => arr.filter((q) => q && q.state !== "fade" && q.state !== "tfade").length;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  let clock = 0;
  function draw() {
    readTheme();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = LW; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = ink;

    // ground level
    BELTS.forEach((b) => drawBelt(b, clock));
    drawPlate(11, 0); drawPlate(0, 11);
    box(-1.8, -15.3, 0, 3.6, 3.6, BELT_Z);
    drawDisc(HUB, HUB.r, HUB.top, rot, 16);
    ringEllipse(HUB.x, HUB.y, HUB.top, 1.25);
    drawDisc(TEAM, TEAM.r, TEAM.top, trot, 10);

    // everything that stands up, back to front
    const items = [
      { k: -15.7, d: drawLibrary },
      { k: -14.2, d: drawPressBack },
      { k: -13.2, d: drawPressHead },
      { k: -13.1, d: drawBeam },
      { k: 0, d: () => cyl(0, 0, HUB.top, 0.55, 3.0) },
      { k: TEAM.x, d: () => cyl(TEAM.x, TEAM.y, TEAM.top, 0.35, 2.1) },
    ];
    for (const st of Object.values(ST)) items.push({ k: st.x + st.y, d: () => drawStation(st) });
    for (const p of packets) {
      if (p.state === "arm") continue;
      let k = p.x + p.y + p.z * 0.02;
      if (p.state === "hop" || p.state === "sink") k = p.hop.st.x + p.hop.st.y + 0.05;
      items.push({ k, d: () => drawPacket(p) });
    }
    items.sort((a, b) => a.k - b.k).forEach((it) => it.d());

    // arms over the turntables
    drawArm(arm1); drawArm(arm2); drawArm(armT);

    // ripples and update signals
    ctx.save();
    for (const r of ripples) {
      const k = r.t / r.dur; ctx.globalAlpha = 1 - k; ctx.lineWidth = LW;
      ringEllipse(r.x, r.y, r.z, r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - k, 3)));
    }
    ctx.restore();
    for (const g of signals) {
      for (let j = 0; j < 7; j++) {
        const s = g.s - j * 0.32; if (s < 0 || s > g.path.len) continue;
        const [x, y, z] = along(g.path, s), q = P(x, y, z);
        ctx.beginPath(); ctx.arc(q[0], q[1], Math.max(1, (4.2 - j * 0.45) * (S / 24)), 0, Math.PI * 2);
        ctx.fillStyle = ink; ctx.globalAlpha = 1 - j / 8; ctx.fill(); ctx.globalAlpha = 1;
      }
    }

    // labels
    const n = ringCount(ring);
    callout(P(-13.9, -1.8, 4.4), 30, -26, "PUBLIC LIBRARY", "trusted skills");
    callout(P(1.8, -11.7, BELT_Z), 34, 14, "YOUR WORKBENCH", "skills you make");
    callout(P(2.19, -2.19, HUB.top), 46, -8, "YOU", hub.note || `${plural(n, "skill")} · 4 agents`);
    callout(P(TEAM.x + 1.13, TEAM.y + 1.13, TEAM.top), 26, 22, "@TEAMMATE", team.note || plural(ringCount(tring), "skill"));
    const at = { pc: [26, -30], pk: [28, 26], wh: [28, 26], wc: [26, -30] };
    for (const [id, st] of Object.entries(ST)) {
      const [dx, dy] = at[id];
      const anchor = dy < 0 ? P(st.x + 1.3, st.y - 1.3, st.h) : P(st.x + 1.3, st.y + 1.3, 0.9);
      callout(anchor, dx, dy, st.name, st.note || `${st.kind} · ${plural(st.skills.size, "skill")}`);
    }
    for (const p of packets) if (p.tag && (p.state === "belt" || p.state === "hold" || p.state === "wait")) tagFor(p);
  }

  // ---- Fit the drawing to the banner width
  const BOUNDS = (() => {
    const pts = [];
    const add = (x, y, z) => pts.push([(x - y) * C30, (x + y) * 0.5 - z]);
    [[-17.5, -1.8, 0], [-13.9, 1.8, 0], [-17.5, -1.8, 4.4], [-13.9, 1.8, 4.4], [-13.9, -1.8, 4.4]].forEach((p) => add(...p));
    [[-1.8, -15.3, 5.32], [0.8, -11.7, 5.32], [1.8, -15.3, 0.4], [1.8, -11.7, 0]].forEach((p) => add(...p));
    for (const s of Object.values(ST)) for (const dx of [-1.3, 1.3]) for (const dy of [-1.3, 1.3]) { add(s.x + dx, s.y + dy, 0); add(s.x + dx, s.y + dy, s.h); }
    add(TEAM.x + 1.6, TEAM.y + 1.6, 0); add(0, 0, 6.2);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return { minX: Math.min(...xs) - 3, maxX: Math.max(...xs) + 7.4, minY: Math.min(...ys) - 2.6, maxY: Math.max(...ys) + 2.6 };
  })();
  function layout() {
    W = Math.round(plate.clientWidth);
    S = W / (BOUNDS.maxX - BOUNDS.minX);
    H = Math.round((BOUNDS.maxY - BOUNDS.minY) * S);
    OX = -BOUNDS.minX * S; OY = -BOUNDS.minY * S;
    DPR = window.devicePixelRatio || 1;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR); cvs.style.height = H + "px";
    LW = Math.max(0.75, S * 0.05);
    themeKey = ""; readTheme();
  }
  new ResizeObserver(() => { layout(); if (reduce) draw(); }).observe(plate);
  layout();

  if (reduce) {
    // A still frame of the running line
    for (let i = 0; i < 60 * 20; i++) { update(1 / 60); clock += 1 / 60; }
    caption(3);
    draw();
    const redraw = () => { themeKey = ""; draw(); };
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
    new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } else {
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      update(dt); clock += dt; draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
  if (document.fonts) document.fonts.ready.then(() => { if (reduce) draw(); });
})();
</script>
