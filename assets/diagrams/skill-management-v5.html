<style>
  /* Banner: an isometric line drawing of a skill production line, ink on paper, no colour */
  :root {
    --paper: #ffffff;
    --ink: #151515;
    --muted: #8c8c90;
    --caption: #b8b8bd;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #0f0f10; --ink: #e8e8e5; --muted: #85858a; --caption: #5c5c61; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #0f0f10; --ink: #e8e8e5; --muted: #85858a; --caption: #5c5c61; color-scheme: dark; }

  body { background: var(--paper); color: var(--ink); margin: 0; }
  .banner { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 24px; box-sizing: border-box; }
  .plate { position: relative; }
  #line { display: block; width: 100%; }
  .caption {
    position: absolute; right: 1%; top: 4%; text-align: right; align-items: flex-end;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transition: opacity 300ms ease;
    pointer-events: none;
  }
  .caption.on { opacity: 1; }
  .caption .idx { font: 500 11px/1 var(--mono); letter-spacing: 0.12em; color: var(--muted); }
  .caption .txt { font: 200 clamp(18px, 2.4vw, 28px)/1.15 var(--display); letter-spacing: -0.01em; color: var(--caption); }
  @media (max-width: 620px) {
    .caption { position: static; margin-top: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .caption { transition: none; } }
</style>

  // Seed: what you and your teammate already keep
  [["swiftui-pro", "pub", 0], ["release-notes", "mine", 2], ["code-review", "pub", 4], ["frontend-design", "team", 5], ["humanizer", "pub", 7]]

  // ---- Arms: the wrist moves in cylindrical coordinates around the base, so arms swing instead of cutting across

  function pluck(o) {

  const CYCLE = 30;

  // ---- Scene pieces

  }
  function drawLibrary() {
    const x0 = -17.6, y0 = STREAM.y - 1.8, fx = STREAM.x0;

    for (const z of [1.05, 2.1, 3.15]) line(P(fx, y0, z), P(fx, y0 + 3.6, z));

  function drawOrb(o) {

    } else {
      ctx.save(); ctx.clip();
      ctx.fillStyle = o.kind === "team" ? cross : hatch; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
      ctx.beginPath(); ctx.arc(cx - R * 0.3, cy - R * 0.32, R * (o.kind === "team" ? 0.62 : 0.9), 0, Math.PI * 2); fillAs("paper");
      ctx.restore();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
  function ik(a) {
    const b = a.base, T = a.pos, dx = T[0] - b[0], dy = T[1] - b[1], dz = T[2] - b[2];
    const d = Math.hypot(dx, dy), L = a.L, D = Math.min(Math.hypot(d, dz), 2 * L - 1e-3);
    const ang = Math.atan2(dz, d) + Math.acos(D / (2 * L));
    return [b[0] + Math.cos(a.yaw) * Math.cos(ang) * L, b[1] + Math.sin(a.yaw) * Math.cos(ang) * L, b[2] + Math.sin(ang) * L];
  }
  function drawArm(a) {
    const k = S / 24, E = ik(a), W3 = a.pos;
    const B = P(...a.base), Ep = P(...E), Wp = P(...W3);
    tube(B, Ep, 8 * k); tube(Ep, Wp, 7 * k);
    joint(B, 4.6 * k); joint(Ep, 3.8 * k);
    if (a.carry) drawOrb(a.carry);
    // gripper: a bar across the wrist and two fingers that close round the orb
    const open = a.carry ? 0.48 : 0.62, px = -Math.sin(a.yaw) * open, py = Math.cos(a.yaw) * open;
    const hz = W3[2], fz = hz - GRIP - ORB;
    const l = [W3[0] - px, W3[1] - py], r = [W3[0] + px, W3[1] + py];
    ctx.save(); ctx.lineWidth = 2.2 * LW;
    line(P(l[0], l[1], hz), P(r[0], r[1], hz));
    line(P(l[0], l[1], hz), P(l[0], l[1], fz)); line(P(r[0], r[1], hz), P(r[0], r[1], fz));
    ctx.restore();
    joint(Wp, 3.2 * k);
  }

  // Leader-line label in the manner of a technical drawing
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  function callout(anchor, dx, dy, l1, l2) {
    const k = S / 24, f1 = Math.max(8, Math.min(12, 10.5 * k)), f2 = f1 - 0.5;
    const ex = anchor[0] + dx * k, ey = anchor[1] + dy * k;
    ctx.save();
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0.08em";
    ctx.font = `500 ${f1}px ${MONO}`; const w1 = ctx.measureText(l1).width;
    ctx.font = `400 ${f2}px ${MONO}`; const w2 = ctx.measureText(l2).width;
    const w = Math.max(w1, w2) + 6, right = dx >= 0, sx = right ? ex + w : ex - w;
    ctx.lineWidth = Math.max(0.7, LW * 0.8);
    ctx.beginPath(); ctx.moveTo(anchor[0], anchor[1]); ctx.lineTo(ex, ey); ctx.lineTo(sx, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(anchor[0], anchor[1], 1.9 * Math.max(1, k), 0, Math.PI * 2); ctx.fillStyle = ink; ctx.fill();
    ctx.textAlign = right ? "left" : "right";
    const tx = right ? ex + 3 : ex - 3;
    ctx.fillStyle = ink; ctx.font = `500 ${f1}px ${MONO}`; ctx.fillText(l1, tx, ey - 4 * Math.max(0.8, k));
    ctx.fillStyle = muted; ctx.font = `400 ${f2}px ${MONO}`; ctx.fillText(l2, tx, ey + f2 + 2);
    ctx.restore();
  }
  function tagFor(o) {
    const k = S / 24, top = P(o.x, o.y, o.z + ORB * o.scale + 0.1), y1 = top[1] - 16 * k;
    ctx.save(); ctx.lineWidth = Math.max(0.7, LW * 0.8);
    line(top, [top[0], y1]);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0.02em";
    ctx.font = `400 ${Math.max(8, Math.min(11, 10 * k))}px ${MONO}`; ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = paper; ctx.strokeText(o.name, top[0], y1 - 4);
    ctx.fillStyle = ink; ctx.fillText(o.name, top[0], y1 - 4);
    ctx.restore();
  }
  const held = (arr) => arr.filter((q) => q && q.state === "ring").length;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const inside = (o, s) => Math.abs(o.x - s.x) < SW / 2 + 0.2 && Math.abs(o.y - s.y) < SW / 2 + 0.2;

  let clock = 0;
  function draw() {
    readTheme();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = LW; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = ink;

    // floor level: the stream, both turntables, the tubes and their cups
    drawStream(clock);
    drawDisc(HUB, HUB.r, HUB.top, rot, 16);
    ringEllipse(0, 0, HUB.top, 1.2);
    drawDisc(TEAM, TEAM.r, TEAM.top, trot, 10);
    Object.values(TUBES).forEach(drawTube);
    Object.values(TUBES).forEach(drawCup);
    { const b = TUBES.team.b; cyl(b[0], b[1], TUBE_Z - 0.45, 0.55, 0.75); }

    // everything that stands up, back to front
    const items = [
      { k: -17.6 + STREAM.y + 1.8, d: drawLibrary },
      { k: 0, d: () => cyl(0, 0, HUB.top, 0.5, 3.0) },
      { k: TEAM.x + TEAM.y, d: () => cyl(TEAM.x, TEAM.y, TEAM.top, 0.3, 1.1) },
    ];
    for (const st of Object.values(ST)) items.push({ k: st.x + st.y, d: () => drawStation(st) });
    for (const o of orbs) {
      if (o.state === "arm" || o.state === "hidden") continue;
      let k = o.x + o.y + o.z * 0.02;
      for (const st of Object.values(ST)) if (inside(o, st)) k = o.state === "emerge" && o.z > SH ? st.x + st.y + 0.05 : st.x + st.y - 0.05;
      items.push({ k, d: () => drawOrb(o) });
    }
    items.sort((a, b) => a.k - b.k).forEach((it) => it.d());

    drawArm(arm1); drawArm(arm2);

    ctx.save();
    for (const r of ripples) {
      const k = r.t / r.dur; ctx.globalAlpha = 1 - k; ctx.lineWidth = LW;
      ringEllipse(r.x, r.y, r.z, r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - k, 3)));
    }
    ctx.restore();
    for (const g of signals) {
      for (let j = 0; j < 7; j++) {
        const s = g.s - j * 0.32; if (s < 0 || s > g.path.len) continue;
        const q = P(...along(g.path, s));
        ctx.beginPath(); ctx.arc(q[0], q[1], Math.max(1, (4.2 - j * 0.45) * (S / 24)), 0, Math.PI * 2);
        ctx.fillStyle = ink; ctx.globalAlpha = 1 - j / 8; ctx.fill(); ctx.globalAlpha = 1;
      }
    }

    // labels
    callout(P(STREAM.x0, STREAM.y - 1.8, 4.2), 30, -24, "PUBLIC SKILLS", "a stream of trusted skills");
    callout(P(-2.12, 2.12, HUB.top), -40, -16, "YOU", hub.note || `${plural(held(ring), "skill")} · 4 agents`);
    callout(P(TEAM.x + 1.06, TEAM.y + 1.06, TEAM.top), 22, 24, "@TEAMMATE", team.note || plural(held(tring), "skill"));
    for (const st of Object.values(ST)) callout(P(st.x + SW / 2, st.y + SW / 2, 0.9), 22, 24, st.name, st.note || `${st.kind} · ${plural(st.skills.size, "skill")}`);
    for (const o of orbs) if (o.tag && (o.state === "stream" || o.state === "emerge" || o.state === "tube")) tagFor(o);
  }

  // ---- Fit the drawing to the banner width
  const BOUNDS = (() => {
    const pts = [];
    const add = (x, y, z) => pts.push([(x - y) * C30, (x + y) * 0.5 - z]);
    for (const z of [0, 4.2]) for (const y of [STREAM.y - 1.8, STREAM.y + 1.8]) add(-17.6, y, z), add(STREAM.x0, y, z);
    add(STREAM.x1 + 1.6, STREAM.y - 0.9, 0); add(STREAM.x1 + 1.6, STREAM.y + 0.9, 0);
    for (const s of Object.values(ST)) for (const dx of [-1.2, 1.2]) for (const dy of [-1.2, 1.2]) { add(s.x + dx, s.y + dy, 0); add(s.x + dx, s.y + dy, SH); }
    for (const a of [0, 1, 2, 3]) add(TEAM.x + Math.cos(a * Math.PI / 2) * TEAM.r, TEAM.y + Math.sin(a * Math.PI / 2) * TEAM.r, 0);
    add(0, 0, 6.4);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    return { minX: Math.min(...xs) - 1.5, maxX: Math.max(...xs) + 5.5, minY: Math.min(...ys) - 2.4, maxY: Math.max(...ys) + 2.6 };
  })();
  function layout() {
    W = Math.round(plate.clientWidth);
    S = W / (BOUNDS.maxX - BOUNDS.minX);
    H = Math.round((BOUNDS.maxY - BOUNDS.minY) * S);
    OX = -BOUNDS.minX * S; OY = -BOUNDS.minY * S;
    DPR = window.devicePixelRatio || 1;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR); cvs.style.height = H + "px";
    LW = Math.max(0.75, S * 0.05);
    themeKey = ""; readTheme();
  }
  new ResizeObserver(() => { layout(); if (reduce) draw(); }).observe(plate);
  layout();

  // Fill the stream before the first frame
  for (let x = STREAM.x0 + 0.1; x < STREAM.x1; x += V * 0.8) mk("", "pub", x, STREAM.y, STREAM.top + ORB, "stream");

  if (reduce) {
    for (let i = 0; i < 60 * 26; i++) { step(1 / 60); clock += 1 / 60; }
    caption(3);
    draw();
    const redraw = () => { themeKey = ""; draw(); };
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
    new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } else {
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      step(dt); clock += dt; draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
  if (document.fonts) document.fonts.ready.then(() => { if (reduce) draw(); });
})();
</script>
