<style>
  /* Banner: a magical marble machine of glass orbs joined by paths, ink on paper, no colour */
  :root {
    --paper: #ffffff;
    --ink: #151515;
    --muted: #8c8c90;
    --caption: #b8b8bd;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #0f0f10; --ink: #e8e8e5; --muted: #85858a; --caption: #5c5c61; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #0f0f10; --ink: #e8e8e5; --muted: #85858a; --caption: #5c5c61; color-scheme: dark; }

  body { background: var(--paper); color: var(--ink); margin: 0; }
  .banner { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 24px; box-sizing: border-box; }
  .plate { position: relative; }
  #line { display: block; width: 100%; }
  .caption {
    position: static; margin-top: 4px; align-items: center; text-align: center; min-height: 3.2em;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transition: opacity 300ms ease;
    pointer-events: none;
  }
  .caption.on { opacity: 1; }
  .caption .idx { font: 500 11px/1 var(--mono); letter-spacing: 0.12em; color: var(--muted); }
  .caption .txt { font: 200 clamp(18px, 2.4vw, 28px)/1.15 var(--display); letter-spacing: -0.01em; color: var(--caption); }
  @media (max-width: 620px) {
    .caption { margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .caption { transition: none; } }
</style>

  let ink = "#151515", paper = "#fff", muted = "#8c8c90", hatch = null, cross = null, themeKey = "";
  const logoTint = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const i = cs.getPropertyValue("--ink").trim(), p = cs.getPropertyValue("--paper").trim();
    const key = i + p + DPR + s;
    if (key === themeKey) return;

  function patternTile(draw) {
    const t = Math.max(1, Math.round(DPR)), n = 5 * t;
    const c = document.createElement("canvas"); c.width = c.height = n;

    return pat;
  }
  function makePatterns() {

    hatch = patternTile(diag);
    cross = patternTile((g, n) => { diag(g, n); g.beginPath(); for (let k = -n; k <= n; k += n) { g.moveTo(k, 0); g.lineTo(k + n, n); } g.stroke(); });
  }

  // ---- State
  let orbs = [], ripples = [], pulses = [], born = 0, streamT = 0, clock = 0;
  function mk(name, kind, x, y) {
    const m = { name, kind, x, y, state: "idle", scale: 1, alpha: 1, tag: false, born: born++ };
    orbs.push(m); return m;
  }
  function ripple(x, y, r1 = 26, dur = 0.9, r0 = 6) { ripples.push({ x, y, r0, r1, t: 0, dur }); }
  function note(n, str, t = 2.2) { n.note = str; n.noteT = t; n.flash = 1; }

  // Take a free cell (centre cells hold the name or logo); make room by letting the oldest go
  function claim(n, m) {
    let free = [];
    n.slots.forEach((q, i) => { if (!q) free.push(i); });
    if (!free.length) {
      const old = n.slots.filter((q) => q && q.state === "home").sort((a, b) => a.born - b.born)[0];
      if (!old) return -1;
      n.slots[old.slot] = null; old.state = "fade"; free = [old.slot];
    }
    const i = free.sort((a, b) => Math.hypot(...n.cells[a]) - Math.hypot(...n.cells[b]) || a - b)[0];
    n.slots[i] = m; return i;
  }
  function place(m, n, i) {
    m.node = n; m.slot = i; m.state = "home";
    [m.x, m.y] = cellPos(n, i);
    for (const q of n.slots) if (q && q !== m && q.name === m.name && q.state === "home") { n.slots[q.slot] = null; q.state = "fade"; }
    compact(n);
  }
  // Keep each cluster packed: if a gap opens nearer the middle, the outermost skill slides into it
  function compact(n) {
    const dist = (i) => Math.hypot(...n.cells[i]);
    for (let guard = 0; guard < 20; guard++) {
      const holes = n.slots.map((q, i) => (q ? -1 : i)).filter((i) => i >= 0).sort((a, b) => dist(a) - dist(b));
      const outer = n.slots.map((q, i) => (q && q.state === "home" ? i : -1)).filter((i) => i >= 0).sort((a, b) => dist(b) - dist(a));
      if (!holes.length || !outer.length || dist(holes[0]) >= dist(outer[0]) - 1) return;
      const h = holes[0], m = n.slots[outer[0]];
      n.slots[outer[0]] = null; n.slots[h] = m; m.slot = h;
      glide(m, [[m.x, m.y], cellPos(n, h)], 0.5, () => { m.state = "home"; });
    }
  }
  // Glide along a path with an ease, then run onEnd
  function glide(m, pts, dur, onEnd) { m.state = "move"; m.path = mkPath(pts); m.t = 0; m.dur = dur; m.onEnd = onEnd; }
  const travel = (path) => 0.5 + mkPath(path).len / 260;

  // Move a copy of a skill from one orb to another along their shared path
  function sendCopy(src, from, to, extra) {
    const viaTeam = from === NODES.team || to === NODES.team;
    if (viaTeam && link.v < 0.95) { openLink(4); later(0.8, () => sendCopy(src, from, to, extra)); return; }
    if (viaTeam) openLink(3.4);
    const m = mk(src.name, src.kind, src.x, src.y);
    const toYou = to === YOU, n = toYou ? from : to;
    const route = toYou ? [...n.route].reverse() : n.route;
    const i = claim(to, m);
    if (i < 0) { m.state = "gone"; return; }
    const target = cellPos(to, i);
    const pts = [[src.x, src.y], ...route, target];
    ripple(src.x, src.y, 16, 0.5);
    glide(m, pts, travel(pts), () => { place(m, to, i); ripple(m.x, m.y, 18, 0.6); to.flash = 1; if (extra) extra(m); });
  }

  // Seed the orbs
  for (const n of Object.values(NODES)) n.seed.forEach(([name, kind]) => { const m = mk(name, kind, 0, 0); place(m, n, claim(n, m)); });
  [["swiftui-pro", "pub"], ["release-notes", "mine"], ["code-review", "pub"], ["frontend-design", "team"], ["humanizer", "pub"]].forEach(([name, kind]) => { const m = mk(name, kind, 0, 0); place(m, YOU, claim(YOU, m)); });

  // ---- The four moves
  const PUBLIC = ["grill-me", "napkin", "gstack", "mcp-builder", "swiftdata-pro", "domain-modeling", "canvas-design", "taskmaster", "retro", "docx", "claudeception", "code-review"];
  let pi = 0;
  function discover(routes) {
    // the next skill heading for the drop that you don't already have
    const m = orbs.filter((q) => q.state === "stream" && !q.target && q.x < PICK_X - 40 && !YOU.slots.some((y) => y && y.name === q.name)).sort((a, b) => b.x - a.x)[0];
    if (!m) return;
    m.target = true; m.tag = true; m.routes = routes;
  }
  function spread(m, from, routes) {
    routes.forEach((id) => sendCopy(m, from, NODES[id])); // all copies leave together
  }
  function create(id, name, routes) {
    const n = NODES[id], m = mk(name, id === "team" ? "team" : "mine", n.x, n.y), i = claim(n, m);
    place(m, n, i); m.scale = 0.1; m.tag = true; m.grow = true;
    note(n, id === "team" ? "shared" : "new skill", 2.4); ripple(m.x, m.y, 30);
    later(1.4, () => { m.tag = false; sendCopy(m, n, YOU, (c) => { c.tag = false; note(YOU, "collected", 1.8); later(0.4, () => spread(c, YOU, routes)); }); });
  }
  function update(name) {
    const n = NODES.wc, cell = n.slots.find((q) => q && q.name === name);
    note(n, "updated", 2.6); if (cell) ripple(cell.x, cell.y, 22, 0.8);
    pulse([...n.route].reverse(), () => {
      note(YOU, "updated", 2.6); ripple(YOU.x, YOU.y, YOU.r + 26, 1.3, YOU.r);
      const mine = YOU.slots.find((q) => q && q.name === name); if (mine) ripple(mine.x, mine.y, 22, 0.8);
      for (const [id, o] of Object.entries(NODES)) {
        if (id === "wc") continue;
        const has = o.slots.find((q) => q && q.name === name);
        if (!has) continue;
        const go = () => pulse(o.route, () => { note(o, "synced", 2.4); ripple(has.x, has.y, 22, 0.8); ripple(o.x, o.y, o.r + 18, 1, o.r); });
        if (o === NODES.team) { openLink(3); later(0.8, go); } else go();
      }
    });
  }
  function pulse(pts, onEnd) { pulses.push({ path: mkPath(pts), d: 0, onEnd }); }
  let timers = [];
  function later(t, fn) { timers.push({ t: clock + t, fn }); }

  const PHRASES = ["Discover trusted public skills", "Manage the skills you make", "Share skills with your team", "Update once & stay in sync."];
  let capTimer = 0, capSwap = 0;
  function caption(i) {
    clearTimeout(capTimer); clearTimeout(capSwap);
    const set = () => { capEl.querySelector(".idx").textContent = `0${i + 1} / 04`; capEl.querySelector(".txt").textContent = PHRASES[i]; capEl.classList.add("on"); };
    if (reduce) { set(); return; }
    capEl.classList.remove("on");
    capSwap = setTimeout(() => { set(); capTimer = setTimeout(() => capEl.classList.remove("on"), 3000); }, 300);
  }

  const CYCLE = 30;
  const EVENTS = [
    [0.3, () => { caption(0); discover(["pc", "wh"]); }],
    [4.5, () => discover(["pk", "wc"])],
    [10.0, () => { caption(1); create("pc", "release-notes", ["wh", "wc"]); }],
    // one direction per loop: you share with your teammate, then next time your teammate shares with you
    [17.0, () => {
      caption(2);
      if (loops % 2 === 0) { const r = YOU.slots.find((q) => q && q.name === "release-notes"); if (r) { note(YOU, "sharing", 1.8); sendCopy(r, YOU, NODES.team, () => note(NODES.team, "received", 2)); } }
      else create("team", "brand-voice", ["wc"]);
    }],
    [23.5, () => { caption(3); update("release-notes"); }],
  ];
  let tc = 0, ei = 0, loops = 0;

  // ---- Simulation step
  function step(dt) {
    clock += dt; tc += dt;
    while (ei < EVENTS.length && tc >= EVENTS[ei][0]) EVENTS[ei++][1]();
    if (tc >= CYCLE) { tc -= CYCLE; ei = 0; loops++; }
    const due = timers.filter((t) => t.t <= clock); timers = timers.filter((t) => t.t > clock); due.forEach((t) => t.fn());

    // public skills drift across, fading in on the left and out on the right
    streamT += dt;
    if (streamT >= EVERY) { streamT -= EVERY; const m = mk(PUBLIC[pi++ % PUBLIC.length], "pub", 20, STREAM_Y); m.state = "stream"; }

    for (const m of orbs) {
      if (m.grow) { m.scale = Math.min(1, m.scale + dt * 2.2); if (m.scale >= 1) m.grow = false; }
      if (m.state === "stream") {
        m.x += DRIFT * dt;
        m.alpha = Math.min(1, (m.x - 20) / FADE, (VW - 20 - m.x) / FADE);
        if (m.target && m.x >= PICK_X) {
          // picked: it leaves the stream and drops into your orb
          const i = claim(YOU, m), target = cellPos(YOU, i), pts = [[m.x, m.y], [PICK_X, YOU.y - YOU.r - 14], target];
          m.alpha = 1;
          glide(m, pts, 1.6, () => { place(m, YOU, i); ripple(m.x, m.y, 20, 0.6); note(YOU, "picked", 1.6); const r = m.routes; m.tag = false; later(0.5, () => spread(m, YOU, r)); });
        } else if (m.x > VW - 20) m.state = "gone";
      }
      if (m.state === "move") {
        m.t += dt; const k = Math.min(1, m.t / m.dur);
        [m.x, m.y] = at(m.path, ease(k) * m.path.len);
        if (k >= 1) { const f = m.onEnd; m.onEnd = null; f && f(); }
      }
      if (m.state === "fade") { m.alpha -= dt * 1.6; m.scale = Math.max(0.2, m.scale - dt); if (m.alpha <= 0) m.state = "gone"; }
    }
    orbs = orbs.filter((m) => m.state !== "gone");

    link.v = Math.max(0, Math.min(1, link.v + (clock < link.hold ? 1 : -1) * dt * 2.2));
    for (const n of ALL) { n.flash = Math.max(0, n.flash - dt * 1.4); if (n.noteT > 0) { n.noteT -= dt; if (n.noteT <= 0) n.note = ""; } }
    ripples.forEach((r) => (r.t += dt)); ripples = ripples.filter((r) => r.t < r.dur);
    for (const p of pulses) { p.d += dt * 420; if (p.d >= p.path.len && p.onEnd) { const f = p.onEnd; p.onEnd = null; f(); } }
    pulses = pulses.filter((p) => p.d < p.path.len + 80);
  }

  // ---- Drawing
  const MR = 12; // skill radius
  function drawSkill(m, x = m.x, y = m.y) {
    const r = MR * m.scale; if (r < 0.6) return;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, m.alpha));
    const face = faces[AUTHOR[m.name]];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (face) {
      fillAs("paper"); ctx.drawImage(face, x - r, y - r, 2 * r, 2 * r);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    } else if (m.kind === "mine") {
      fillAs("ink"); ctx.stroke();
      ctx.beginPath(); ctx.arc(x - r * 0.38, y - r * 0.38, r * 0.2, 0, Math.PI * 2); fillAs("paper");
    } else {
      ctx.save(); ctx.clip();
      ctx.fillStyle = m.kind === "team" ? cross : hatch; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
      ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.32, r * (m.kind === "team" ? 0.6 : 0.9), 0, Math.PI * 2); fillAs("paper");
      ctx.restore();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
  // A glass orb: outline, inner rim, a highlight, and the empty cells of its grid
  function drawNode(n) {
    const lit = n.flash;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); fillAs("paper"); ctx.stroke();
    ctx.save(); ctx.lineWidth = 0.8; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 5, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 10, Math.PI * 1.08, Math.PI * 1.32); ctx.stroke();
    ctx.restore();
    if (lit > 0.05) { ctx.save(); ctx.globalAlpha = lit * 0.8; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  }
  // A dotted path; shared stretches start at the same point, so their dots line up and read as one path
  function dotted(pts, alpha = 1) {
    const list = typeof pts[0][0] === "number" ? [pts] : pts;
    ctx.save(); ctx.globalAlpha = alpha; ctx.lineWidth = 1.6; ctx.lineCap = "round"; ctx.setLineDash([0.1, 6]);
    for (const q of list) { ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) ctx.lineTo(q[i][0], q[i][1]); ctx.stroke(); }
    ctx.restore();
  }
  function drawTubes() {
    dotted(["pc", "pk", "wh", "wc"].map((id) => NODES[id].route));
    // the path to your teammate: each half grows out of its own orb and they meet across a small gap
    if (link.v > 0.01) {
      const [a, b] = NODES.team.route, mid = (a[0] + b[0]) / 2, e = ease(link.v);
      const l = a[0] + (mid - GAP / 2 - a[0]) * e, r = b[0] - (b[0] - mid - GAP / 2) * e;
      dotted([a, [l, a[1]]], e); dotted([[r, b[1]], b], e);
    }
  }
  function tagFor(m) {
    const y1 = m.y - MR - 14;
    ctx.save(); ctx.globalAlpha = Math.min(1, m.alpha); ctx.lineWidth = 0.9; line([m.x, m.y - MR - 2], [m.x, y1]);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0.02em"; ctx.font = `400 10px ${MONO}`; ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = paper; ctx.strokeText(m.name, m.x, y1 - 4); ctx.fillStyle = ink; ctx.fillText(m.name, m.x, y1 - 4);
    ctx.restore();
  }
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const held = (n) => n.slots.filter((q) => q && q.state === "home").length;

  function draw() {
    readTheme();
    ctx.setTransform(DPR * s, 0, 0, DPR * s, 0, 0);
    ctx.fillStyle = paper; ctx.fillRect(0, 0, VW, VH);
    ctx.lineWidth = LW; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = ink;

    // the stream's guide line, faint at both ends
    const grad = ctx.createLinearGradient(20, 0, VW - 20, 0);
    grad.addColorStop(0, "rgba(0,0,0,0)"); grad.addColorStop(0.12, muted); grad.addColorStop(0.88, muted); grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.save(); ctx.strokeStyle = grad; ctx.lineWidth = 0.9; ctx.setLineDash([1.5, 5]); line([20, STREAM_Y + MR + 4], [VW - 20, STREAM_Y + MR + 4]); ctx.restore();
    // a short drop from the stream into your orb
    ctx.save(); ctx.lineWidth = 0.9; ctx.setLineDash([1.5, 5]); line([PICK_X, STREAM_Y + MR + 8], [PICK_X, YOU.y - YOU.r - 4]); ctx.restore();

    drawTubes();
    for (const n of ALL) drawNode(n);

    // skills: in cells, moving, and in the stream
    for (const m of orbs) drawSkill(m);

    // ripples and update pulses
    ctx.save();
    for (const r of ripples) { const k = r.t / r.dur; ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - k, 3)), 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    for (const p of pulses) for (let j = 0; j < 9; j++) {
      const d = p.d - j * 8; if (d < 0 || d > p.path.len) continue;
      const [x, y] = at(p.path, d);
      ctx.beginPath(); ctx.arc(x, y, Math.max(1, 4.4 - j * 0.42), 0, Math.PI * 2); ctx.fillStyle = ink; ctx.globalAlpha = 1 - j / 10; ctx.fill(); ctx.globalAlpha = 1;
    }

    // labels
    text("PUBLIC SKILLS", 24, STREAM_Y - 44, { size: 10.5, weight: 500 });
    text("a stream of trusted skills", 24, STREAM_Y - 30, { size: 10, color: muted });
    text("YOU", YOU.x, YOU.y + YOU.r + 18, { size: 10.5, weight: 500, align: "center", spacing: "0.1em" });
    text(YOU.note || `${plural(held(YOU), "skill")} · 4 agents`, YOU.x, YOU.y + YOU.r + 32, { size: 10, color: YOU.note ? ink : muted, align: "center" });
    for (const n of Object.values(NODES)) {
      const below = n.y + n.r + 18;
      if (n.logo) {
        // the agent's logo sits just left of its name
        ctx.save(); if ("letterSpacing" in ctx) ctx.letterSpacing = "0.1em"; ctx.font = `500 10.5px ${MONO}`; const w = ctx.measureText(n.label).width; ctx.restore();
        const x0 = n.x - (w + 18) / 2;
        logo(n.logo, x0 + 6, below - 4, 13, "ink");
        text(n.label, x0 + 18, below, { size: 10.5, weight: 500, spacing: "0.1em" });
      } else text(n.label, n.x, below, { size: 10.5, weight: 500, align: "center", spacing: "0.1em" });
      text(n.note || n.kind, n.x, below + 14, { size: 10, color: n.note ? ink : muted, align: "center" });
    }
    for (const m of orbs) if (m.tag) tagFor(m);
  }

  // ---- Fit to the banner width
  function layout() {
    W = Math.round(plate.clientWidth); s = W / VW; H = Math.round(VH * s);
    DPR = window.devicePixelRatio || 1;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR); cvs.style.height = H + "px";
    themeKey = ""; readTheme();
  }
  new ResizeObserver(() => { layout(); if (reduce) draw(); }).observe(plate);
  layout();

  // the stream is already flowing on the first frame
  for (let x = VW - 40; x > 20; x -= DRIFT * EVERY) { const m = mk(PUBLIC[pi++ % PUBLIC.length], "pub", x, STREAM_Y); m.state = "stream"; m.alpha = Math.min(1, (x - 20) / FADE, (VW - 20 - x) / FADE); }

  if (reduce) {
    for (let i = 0; i < 60 * 27; i++) step(1 / 60);
    caption(3); draw();
    const redraw = () => { themeKey = ""; draw(); };
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
    new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } else {
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      step(dt); draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
  if (document.fonts) document.fonts.ready.then(() => { if (reduce) draw(); });
})();
</script>
