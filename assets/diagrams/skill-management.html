<title>One Library, Every Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #101217;
    --muted: #5f6571;
    --faint: #9aa0aa;
    --line: #e3e5ea;
    --surface: #f5f6f8;
    --raised: #ffffff;
    --chip: #ffffff;
    --you: #2456d8;
    --you-tint: rgba(36, 86, 216, 0.09);
    --mate: #b87a55;
    --mate-tint: rgba(184, 122, 85, 0.08);
    --sans: "Geist", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115;
      --ink: #eceef2;
      --muted: #9aa1ad;
      --faint: #6b717c;
      --line: #2a2e37;
      --surface: #171a20;
      --raised: #1d2027;
      --chip: #23262e;
      --you: #86a8ff;
      --you-tint: rgba(134, 168, 255, 0.13);
      --mate: #d6a07e;
      --mate-tint: rgba(214, 160, 126, 0.10);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115;
    --ink: #eceef2;
    --muted: #9aa1ad;
    --faint: #6b717c;
    --line: #2a2e37;
    --surface: #171a20;
    --raised: #1d2027;
    --chip: #23262e;
    --you: #86a8ff;
    --you-tint: rgba(134, 168, 255, 0.13);
    --mate: #d6a07e;
    --mate-tint: rgba(214, 160, 126, 0.10);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 20px;
    padding-block: 28px 40px;
  }
  .stage { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }

  /* Narration */
  .story { display: grid; gap: 12px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .steps button, .replay {
    font: 500 13px/1 var(--sans);
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 12px 7px 8px;
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer;
  }
  .steps button .n {
    font: 500 11px/1 var(--mono);
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-grid; place-items: center;
    background: var(--surface); color: var(--muted);
  }
  .steps button[aria-current="step"] { color: var(--ink); border-color: var(--ink); }
  .steps button[aria-current="step"] .n { background: var(--ink); color: var(--bg); }
  .steps button.done .n { background: var(--you-tint); color: var(--you); }
  .replay { margin-left: auto; padding: 7px 12px; }
  .steps button:focus-visible, .replay:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .caption { min-height: 4.2em; }
  .caption h2 {
    margin: 0 0 2px;
    font-size: clamp(20px, 3vw, 26px);
    line-height: 1.2;
    letter-spacing: -0.02em;
    font-weight: 650;
    text-wrap: balance;
  }
  .caption p { margin: 0; color: var(--muted); max-width: 60ch; }
  .caption code { font-family: var(--mono); font-size: 0.9em; color: var(--ink); }

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #flow { display: block; width: 100%; min-width: 640px; height: auto; }

  /* SVG */
  #flow text { fill: var(--ink); font-family: var(--sans); }
  #flow .row-label { fill: var(--faint); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; }
  #flow .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  #flow .omg-you .card { fill: var(--raised); stroke: var(--you); stroke-width: 2; }
  #flow .omg-mate .card { fill: var(--surface); stroke: var(--mate); stroke-width: 1; stroke-dasharray: 4 3; }
  #flow .agent .card { transition: stroke 400ms ease, stroke-width 400ms ease; }
  #flow .agent.lit .card { stroke: var(--ink); stroke-width: 1.5; fill: var(--raised); }
  #flow .kicker { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.07em; }
  #flow .title { font-size: 16px; font-weight: 600; }
  #flow .omg-you .title { font-size: 19px; font-weight: 650; }
  #flow .omg-mate .title { font-size: 14px; font-weight: 500; fill: var(--muted); }
  #flow .dot.you { fill: var(--you); }
  #flow .dot.mate { fill: var(--mate); }
  #flow .handle { fill: var(--muted); font-size: 11.5px; }

  #flow .chip rect.bg { fill: var(--chip); stroke: var(--line); stroke-width: 1.2; }
  #flow .chip.you rect.bg { fill: var(--you-tint); stroke: var(--you); }
  #flow .chip.mate rect.bg { fill: var(--mate-tint); stroke: var(--mate); }
  #flow .chip.private rect.bg { stroke-dasharray: 3.5 2.5; }
  #flow .chip.src { filter: drop-shadow(0 1px 1.5px rgba(16, 18, 23, 0.10)); }
  #flow .chip text.name { font-family: var(--mono); font-size: 12.5px; }
  #flow .chip .lock { fill: none; stroke-width: 1.3; stroke: var(--muted); }
  #flow .chip.you .lock { stroke: var(--you); }
  #flow .chip.mate .lock { stroke: var(--mate); }
  #flow .avatar-ring { fill: none; stroke: var(--line); stroke-width: 1; }
  #flow .person-bg.you { fill: var(--you); }
  #flow .person-bg.mate { fill: var(--mate); }
  #flow .person { fill: var(--bg); }

  #flow .link path { fill: none; stroke-width: 1.6; }
  #flow .link.you path { stroke: var(--you); }
  #flow .link.mate path { stroke: var(--mate); stroke-dasharray: 4 3; }
  #flow .arrow.you path { fill: var(--you); }
  #flow .arrow.mate path { fill: var(--mate); }
  #flow .link text {
    font-size: 11.5px; font-weight: 500;
    stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; paint-order: stroke;
  }
  #flow .link.you text { fill: var(--you); }
  #flow .link.mate text { fill: var(--mate); }

  /* Motion */
  #flow .anim {
    transition:
      transform 900ms cubic-bezier(0.22, 0.8, 0.24, 1),
      opacity 450ms ease;
  }
  #flow .draw path {
    transition: stroke-dashoffset 800ms ease;
  }
  #flow.instant .anim, #flow.instant .draw path, #flow.instant .card { transition: none !important; }
  #flow .chip { cursor: default; }
  #flow.tracing .chip:not(.hit) { opacity: 0.2 !important; }
  @media (prefers-reduced-motion: reduce) {
    #flow .anim, #flow .draw path, #flow .agent .card { transition: none !important; }
  }
</style>

<div class="stage">
  <div class="story">
    <div class="controls">
      <ol class="steps" id="steps"></ol>
      <button class="replay" id="replay" type="button">Replay</button>
    </div>
    <div class="caption" aria-live="polite">
      <h2 id="cap-title"></h2>
      <p id="cap-body"></p>
    </div>
  </div>
  <div class="scroll">
    <svg id="flow" viewBox="0 0 800 620" role="img"
      aria-label="Skills written by different people, such as grill-me by mattpocock and humanizer by blader, are collected into your OMG. Your OMG sends a chosen set of skills to each agent: your ChatGPT, your Claude, a team Hermes and a team ChatGPT. Your teammate Sam's OMG also sends skills to the same team ChatGPT."></svg>
  </div>
</div>

  // ---- Geometry
  const NS = "http://www.w3.org/2000/svg";

  const W = 800, CH = 30, CG = 8, M = 20;
  const AG_Y = 392, AG_GAP = 14, AG_W = (W - 2 * M - 3 * AG_GAP) / 4;

  const el = (tag, attrs, parent) => {

    for (const k in attrs) n.setAttribute(k, attrs[k]);

    return n;
  };
  const txt = (parent, x, y, s, cls, anchor) => {

  function avatar(g, who, cx, cy, r) {
    const p = PEOPLE[who];
    if (p.img) {

  // A chip is drawn at the origin and moved with CSS transforms.
  function chip(parent, name, variant, extra) {
    const s = SKILLS[name];
    const w = chipW(name);
    const g = el("g", { class: `chip anim ${variant}${s.private ? " private" : ""} ${extra || ""}`, "data-skill": name }, parent);

    const at = (t) => {
      const u = 1 - t;
      return [

        u * u * u * sy + 3 * u * u * t * (sy + c) + 3 * u * t * t * (ey - c) + t * t * t * ey,
      ];
    };
    return { d: `M${sx} ${sy}C${sx} ${sy + c} ${ex} ${ey - c} ${ex} ${ey}`, at };

      steppers.push((st) => st >= 1
        ? place(c, slot[name].x, slot[name].y, 1, 250 + i * 140)
        : place(c, srcPos[name].x, srcPos[name].y, 0));
    });

    // Sam's OMG: smaller, quieter, sits above the team agent it feeds
    const theirs = Object.keys(SKILLS).filter((n) => SKILLS[n].omg === "mate");
    const mColW = Math.max(...theirs.map(chipW));
    const mW = mColW + 24, mH = 50 + theirs.length * CH + (theirs.length - 1) * CG + 12;
    const mX = Math.min(W - M - mW, agentX(3) + AG_W / 2 - mW / 2);
    const mate = el("g", { class: "omg-mate anim" }, cardLayer);
    el("rect", { class: "card", x: 0, y: 0, width: mW, height: mH, rx: 12 }, mate);
    el("circle", { class: "dot mate", cx: 16, cy: 18, r: 3.5 }, mate);
    txt(mate, 25, 22, "TEAMMATE", "kicker");
    txt(mate, 12, 40, "Sam's OMG", "title");
    steppers.push((st) => place(mate, mX, st >= 3 ? MATE_Y : MATE_Y - 10, st >= 3 ? 1 : 0));
    theirs.forEach((name, i) => {
      slot[name] = { x: mX + 12, y: MATE_Y + 50 + i * (CH + CG) };
      const c = chip(chipLayer, name, "mate");
      steppers.push((st) => place(c, slot[name].x, st >= 3 ? slot[name].y : slot[name].y - 10, st >= 3 ? 1 : 0, st >= 3 ? 120 + i * 80 : 0));
    });

    // 3 + 4. Agents
    const omgBottom = OMG_Y + omgH;
    AGENTS.forEach((a, ai) => {
      const ax = agentX(ai);
      const list = [...(a.from.you || []), ...(a.from.mate || [])];
      const h = 50 + list.length * CH + (list.length - 1) * CG + 14;
      const card = el("g", { class: "agent anim" + (a.shared ? " shared" : "") }, cardLayer);
      el("rect", { class: "card", x: 0, y: 0, width: AG_W, height: h, rx: 12 }, card);
      el("circle", { class: "dot you", cx: 16, cy: 18, r: 3.5 }, card);
      const k1 = txt(card, 25, 22, a.kind.toUpperCase(), "kicker");
      txt(card, 12, 42, a.name, "title");
      let mateBits = [];
      if (a.shared) {
        const d2 = el("circle", { class: "dot mate anim", cx: 26, cy: 18, r: 3.5 }, card);
        const k2 = txt(card, 35, 22, "TEAM · SHARED", "kicker anim");
        k1.classList.add("anim");
        mateBits = [d2, k2, k1];
      }
      steppers.push((st) => {
        place(card, ax, st >= 2 ? AG_Y : AG_Y + 14, st >= 2 ? 1 : 0, st >= 2 ? ai * 90 : 0);
        card.classList.toggle("lit", !!a.shared && st >= 3);
        if (mateBits.length) {
          mateBits[0].style.opacity = st >= 3 ? 1 : 0;
          mateBits[1].style.opacity = st >= 3 ? 1 : 0;
          mateBits[2].style.opacity = st >= 3 ? 0 : 1;
        }
      });

      list.forEach((name, k) => {
        const owner = SKILLS[name].omg;
        const at = owner === "mate" ? 3 : 2;
        const c = chip(chipLayer, name, owner);
        const tx = ax + 12, ty = AG_Y + 50 + k * (CH + CG);
        steppers.push((st) => st >= at
          ? place(c, tx, ty, 1, 350 + (owner === "mate" ? 0 : ai * 160) + k * 90)
          : place(c, slot[name].x, slot[name].y, 0));
      });

      // Links
      for (const o of Object.keys(a.from)) {
        const n = a.from[o].length;
        const sx = o === "you" ? omgX + omgW * (ai + 1) / (AGENTS.length + 1) : mX + mW / 2;
        const sy = o === "you" ? omgBottom : MATE_Y + mH;
        const ex = ax + AG_W / 2 + (a.shared ? (o === "you" ? -26 : 26) : 0);
        const ey = AG_Y - 3;
        const cv = curve(sx, sy, ex, ey);
        const lg = el("g", { class: "link draw " + o }, linkLayer);
        const p = el("path", { d: cv.d, pathLength: 1, "marker-end": `url(#arrow-${o})` }, lg);
        if (o === "you") p.setAttribute("stroke-dasharray", "1 1");
        const [lx, ly] = cv.at(0.5);
        const t = txt(lg, lx, ly + 4, a.shared ? `${n} from ${o === "you" ? "you" : "Sam"}` : `${n} skill${n === 1 ? "" : "s"}`, "anim", "middle");
        const from = o === "mate" ? 3 : 2;
        steppers.push((st) => {
          const on = st >= from;
          if (o === "you") {
            p.style.strokeDashoffset = on ? 0 : 1;
            p.style.transitionDelay = on ? 150 + ai * 120 + "ms" : "0ms";
          }
          lg.style.opacity = on ? 1 : 0;
          lg.style.transition = "opacity 300ms ease";
          lg.style.transitionDelay = on ? 150 + ai * 120 + "ms" : "0ms";
          t.style.opacity = on ? 1 : 0;
        });
      }
    });

    const agentsBottom = AG_Y + Math.max(...AGENTS.map((a) => {
      const n = Object.values(a.from).flat().length;
      return 50 + n * CH + (n - 1) * CG + 14;
    }));
    svg.setAttribute("viewBox", `0 0 ${W} ${agentsBottom + 16}`);
    measurer.remove();
  }

  // ---- Playback
  const stepsEl = document.getElementById("steps");
  const capTitle = document.getElementById("cap-title");
  const capBody = document.getElementById("cap-body");
  const replay = document.getElementById("replay");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HOLD = 4200;
  let current = 0, timer = null;

  STEPS.forEach((s, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="n">${i + 1}</span>${s.label}`;
    b.addEventListener("click", () => { stop(); show(i); });
    li.appendChild(b);
    stepsEl.appendChild(li);
  });
  const buttons = [...stepsEl.querySelectorAll("button")];

  function show(i) {
    current = i;
    steppers.forEach((f) => f(i));
    buttons.forEach((b, k) => {
      if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", k < i);
    });
    capTitle.textContent = STEPS[i].title;
    capBody.innerHTML = STEPS[i].body;
  }
  function stop() { clearTimeout(timer); timer = null; }
  function tick() {
    if (current >= STEPS.length - 1) { stop(); return; }
    show(current + 1);
    timer = setTimeout(tick, HOLD);
  }
  function play() {
    stop();
    svg.classList.add("instant");
    show(0);
    svg.getBoundingClientRect();
    requestAnimationFrame(() => {
      svg.classList.remove("instant");
      timer = setTimeout(tick, HOLD);
    });
  }
  replay.addEventListener("click", play);

  // Hover a chip to see every copy of that skill
  svg.addEventListener("pointerover", (e) => {
    const c = e.target.closest && e.target.closest(".chip");
    svg.classList.toggle("tracing", !!c);
    svg.querySelectorAll(".chip.hit").forEach((n) => n.classList.remove("hit"));
    if (c) svg.querySelectorAll(`.chip[data-skill="${c.dataset.skill}"]`).forEach((n) => n.classList.add("hit"));
  });
  svg.addEventListener("pointerleave", () => svg.classList.remove("tracing"));

  function start() {
    build();
    svg.classList.add("instant");
    if (reduced) { show(STEPS.length - 1); svg.classList.remove("instant"); return; }
    play();
  }
  start();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      const keep = current, playing = !!timer;
      build();
      svg.classList.add("instant");
      show(keep);
      svg.getBoundingClientRect();
      requestAnimationFrame(() => svg.classList.remove("instant"));
      if (!playing && !reduced && keep === 0) timer = setTimeout(tick, HOLD);
    });
  }
})();
</script>
