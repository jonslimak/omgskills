<title>One Library, Every Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #101217;
    --muted: #5f6571;
    --line: #e3e5ea;
    --surface: #f5f6f8;
    --raised: #ffffff;
    --neutral-chip: #ffffff;
    --you: #2456d8;
    --you-tint: rgba(36, 86, 216, 0.09);
    --mate: #c2521b;
    --mate-tint: rgba(194, 82, 27, 0.09);
    --sans: "Geist", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115;
      --ink: #eceef2;
      --muted: #9aa1ad;
      --line: #2a2e37;
      --surface: #171a20;
      --raised: #1d2027;
      --neutral-chip: #23262e;
      --you: #86a8ff;
      --you-tint: rgba(134, 168, 255, 0.13);
      --mate: #ff9d66;
      --mate-tint: rgba(255, 157, 102, 0.13);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115;
    --ink: #eceef2;
    --muted: #9aa1ad;
    --line: #2a2e37;
    --surface: #171a20;
    --raised: #1d2027;
    --neutral-chip: #23262e;
    --you: #86a8ff;
    --you-tint: rgba(134, 168, 255, 0.13);
    --mate: #ff9d66;
    --mate-tint: rgba(255, 157, 102, 0.13);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 20px;
    padding-block: 32px 40px;
  }
  figure { margin: 0 auto; max-width: 1320px; display: grid; gap: 14px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #flow { display: block; width: 100%; min-width: 980px; height: auto; }

  .figfoot {
    display: flex; flex-wrap: wrap; gap: 10px 28px;
    align-items: baseline; justify-content: space-between;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 22px; height: 12px; border-radius: 3px; border: 1.5px solid; }
  .swatch.you { border-color: var(--you); background: var(--you-tint); }
  .swatch.mate { border-color: var(--mate); background: var(--mate-tint); }
  .swatch.private { border-color: var(--muted); border-style: dashed; }
  .face { width: 14px; height: 14px; border-radius: 50%; background: #0f8b8d; }
  #status { font-size: 14px; margin: 0; min-height: 1.5em; }
  #status b { font-family: var(--mono); font-weight: 500; }

  /* SVG */
  #flow text { fill: var(--ink); font-family: var(--sans); }
  #flow .col-head { fill: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; }
  #flow .col-head .step { fill: var(--ink); font-weight: 500; }
  #flow .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  #flow .omg .card { fill: var(--raised); stroke-width: 1.5; }
  #flow .omg.you .card { stroke: var(--you); }
  #flow .omg.mate .card { stroke: var(--mate); }
  #flow .agent.shared .card { fill: var(--raised); stroke: var(--ink); stroke-width: 1.5; }
  #flow .kicker { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.07em; }
  #flow .card-title { font-size: 16px; font-weight: 600; }
  #flow .omg .card-title { font-size: 18px; }
  #flow .dot.you { fill: var(--you); }
  #flow .dot.mate { fill: var(--mate); }
  #flow .author { fill: var(--muted); font-size: 12px; }

  #flow .chip rect { stroke-width: 1.3; }
  #flow .chip.src rect { fill: var(--neutral-chip); stroke: var(--line); stroke-width: 1.3; }
  #flow .chip.you rect { fill: var(--you-tint); stroke: var(--you); }
  #flow .chip.mate rect { fill: var(--mate-tint); stroke: var(--mate); }
  #flow .chip.private rect { stroke-dasharray: 3.5 2.5; }
  #flow .chip.src.private rect { stroke: var(--muted); }
  #flow .chip text { font-family: var(--mono); font-size: 12px; }
  #flow .chip .lock { fill: none; stroke-width: 1.3; stroke: var(--muted); }
  #flow .chip.you .lock { stroke: var(--you); }
  #flow .chip.mate .lock { stroke: var(--mate); }
  #flow .chip .avatar-ring { fill: none; stroke: var(--bg); stroke-width: 1.5; }
  #flow .chip text.initial {
    font-family: var(--sans); font-size: 8.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0;
  }
  #flow .chip, #flow .agent { cursor: pointer; outline: none; }
  #flow .chip:focus-visible rect, #flow .agent:focus-visible .card { stroke-width: 2.5; stroke: var(--ink); }
  #flow .count { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  #flow .link path { fill: none; stroke-width: 1.6; }
  #flow .link.collect path { stroke-width: 1.3; stroke-dasharray: 4 3; }
  #flow .link.you path { stroke: var(--you); }
  #flow .link.mate path { stroke: var(--mate); }
  #flow .arrow.you path { fill: var(--you); }
  #flow .arrow.mate path { fill: var(--mate); }
  #flow .link text {
    font-size: 11.5px; font-weight: 500;
    stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; paint-order: stroke;
  }
  #flow .link.you text { fill: var(--you); }
  #flow .link.mate text { fill: var(--mate); }

  #flow .chip, #flow .link, #flow .card-body, #flow .count, #flow .author { transition: opacity 160ms ease; }
  #flow.focusing .chip:not(.on),
  #flow.focusing .link:not(.on),
  #flow.focusing .agent:not(.on) .card-body,
  #flow.focusing .count:not(.on),
  #flow.focusing .author:not(.on) { opacity: 0.16; }
  @media (prefers-reduced-motion: reduce) {
    #flow .chip, #flow .link, #flow .card-body, #flow .count, #flow .author { transition: none; }
  }
</style>

<figure>
  <div class="scroll">
    <svg id="flow" viewBox="0 0 1320 660" role="img"
      aria-label="Skills written by different people are collected into two OMG libraries, yours and your teammate Sam's. Each OMG sends a chosen subset of its skills to agents. Your OMG feeds your personal ChatGPT, your personal Claude, a team Hermes and a shared team ChatGPT. Sam's OMG feeds the same shared team ChatGPT and Sam's personal ChatGPT, so the shared agent gets skills from both libraries."></svg>
  </div>
  <figcaption class="figfoot">
    <p id="status" aria-live="polite">Point at a skill or an agent to trace it from author to agent.</p>
    <div class="legend">
      <span><i class="face"></i>Skill author</span>
      <span><i class="swatch you"></i>In your OMG</span>
      <span><i class="swatch mate"></i>In Sam's OMG</span>
      <span><i class="swatch private"></i>Private team skill</span>
    </div>
  </figcaption>
</figure>

<script>
(() => {
  // Edit this block to change the example. Layout is computed from it.
  const PEOPLE = {
    lena: { name: "Lena Ortiz", initials: "LO", color: "#0f8b8d" },
    kai: { name: "Kai Tanaka", initials: "KT", color: "#7b4bb7" },
    arjun: { name: "Arjun Mehta", initials: "AM", color: "#5d7f1f" },
    sofia: { name: "Sofia Rossi", initials: "SR", color: "#b8336a" },
    you: { name: "You", initials: "Y", color: "#2456d8" },
    sam: { name: "Sam", initials: "S", color: "#c2521b" },
  };
  const SOURCES = [
    { id: "library", kicker: "Public", title: "omgskills library", skills: ["humanizer", "grill-me", "ios-expert", "web-expert"] },
    { id: "team", kicker: "Private", title: "Your team's GitHub", skills: ["team-skill-1", "team-skill-2"] },
  ];
  const OWNERS = {
    you: { omg: "Your OMG", ref: "your OMG", who: "You", short: "you" },
    mate: { omg: "Sam's OMG", ref: "Sam's OMG", who: "Teammate", short: "Sam" },
  };
  // owner = whose OMG collects the skill; author = who wrote it
  const SKILLS = {
    "humanizer": { owner: "you", author: "lena" },
    "grill-me": { owner: "you", author: "kai" },
    "ios-expert": { owner: "you", author: "arjun" },
    "team-skill-1": { owner: "you", author: "you", private: true },
    "web-expert": { owner: "mate", author: "sofia" },
    "team-skill-2": { owner: "mate", author: "sam", private: true },
  };
  const AGENTS = [
    { id: "you-chatgpt", name: "ChatGPT", kind: "Personal · you", owners: ["you"], skills: ["ios-expert", "grill-me", "humanizer"] },
    { id: "you-claude", name: "Claude", kind: "Personal · you", owners: ["you"], skills: ["humanizer"] },
    { id: "team-hermes", name: "Hermes", kind: "Team", owners: ["you"], skills: ["grill-me", "humanizer"] },
    { id: "team-chatgpt", name: "ChatGPT", kind: "Team · shared", owners: ["you", "mate"], skills: ["humanizer", "team-skill-1", "ios-expert", "grill-me", "web-expert", "team-skill-2"] },
    { id: "mate-chatgpt", name: "ChatGPT", kind: "Personal · Sam", owners: ["mate"], skills: ["web-expert"] },
  ];

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("flow");
  const status = document.getElementById("status");
  const REST = "Point at a skill or an agent to trace it from author to agent.";
  const W = 1320, TOP = 44, PAD = 16, CH = 26, CG = 8, RG = 8, GAP = 18, HEAD = 56;
  const SRC_X = 24, SRC_W = 262, OMG_X = 400, OMG_W = 280, AG_X = 884, AG_W = 416;

  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const txt = (parent, x, y, s, cls, anchor) => {
    const t = el("text", { x, y, class: cls || "" }, parent);
    if (anchor) t.setAttribute("text-anchor", anchor);
    t.textContent = s;
    return t;
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const agentsWith = (name) => AGENTS.filter((a) => a.skills.includes(name));
  const agentLabel = (a) =>
    (a.kind.startsWith("Team") ? "team " : a.owners[0] === "you" ? "your " : "Sam's ") + a.name;

  let measurer;
  const chipWidth = (name) => {
    measurer.textContent = name;
    const tw = Math.ceil(measurer.getComputedTextLength());
    return tw + 40 + (SKILLS[name].private ? 14 : 0);
  };

  function chip(parent, name, x, y, neutral) {
    const s = SKILLS[name];
    const p = PEOPLE[s.author];
    const w = chipWidth(name);
    const g = el("g", {
      class: `chip ${neutral ? "src" : s.owner}${s.private ? " private" : ""}`,
      "data-skill": name, tabindex: 0, role: "button",
      "aria-label": `${name} by ${p.name}${s.private ? ", private team skill" : ""}`,
      transform: `translate(${x} ${y})`,
    }, parent);
    el("rect", { width: w, height: CH, rx: 6 }, g);
    el("circle", { cx: 13, cy: CH / 2, r: 8.5, fill: p.color }, g);
    el("circle", { class: "avatar-ring", cx: 13, cy: CH / 2, r: 9.25 }, g);
    txt(g, 13, CH / 2 + 3, p.initials, "initial", "middle");
    txt(g, 28, 17.5, name);
    if (s.private) {
      const cx = w - 14, cy = CH / 2 + 1;
      el("rect", { class: "lock", x: cx - 4, y: cy - 1, width: 8, height: 6, rx: 1 }, g);
      el("path", { class: "lock", d: `M${cx - 2.5} ${cy - 1}V${cy - 3.5}A2.5 2.5 0 0 1 ${cx + 2.5} ${cy - 3.5}V${cy - 1}` }, g);
    }
    return w;
  }

  function wrapChips(names, maxW) {
    const rows = [[]];
    let x = 0;
    for (const name of names) {
      const w = chipWidth(name);
      if (x > 0 && x + w > maxW) { rows.push([]); x = 0; }
      rows[rows.length - 1].push({ name, w });
      x += w + CG;
    }
    return rows;
  }

  function curve(sx, sy, ex, ey) {
    const c = (ex - sx) * 0.45;
    return {
      d: `M${sx} ${sy}C${sx + c} ${sy} ${ex - c} ${ey} ${ex} ${ey}`,
      at(t) {
        const u = 1 - t, c1 = sx + c, c2 = ex - c;
        return [
          u * u * u * sx + 3 * u * u * t * c1 + 3 * u * t * t * c2 + t * t * t * ex,
          u * u * u * sy + 3 * u * u * t * sy + 3 * u * t * t * ey + t * t * t * ey,
        ];
      },
    };
  }

  const listHeight = (n) => HEAD + n * CH + (n - 1) * RG + PAD;

  function render() {
    svg.textContent = "";
    measurer = el("text", { x: -999, y: -999, style: "font-family: var(--mono); font-size: 12px" }, svg);
    const defs = el("defs", {}, svg);
    for (const o of Object.keys(OWNERS)) {
      const m = el("marker", { id: "arrow-" + o, class: "arrow " + o, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
      el("path", { d: "M0,1 L10,5 L0,9 z" }, m);
    }
    const linkLayer = el("g", {}, svg);
    const nodeLayer = el("g", {}, svg);
    const head = (x, n, label) => {
      const t = el("text", { x, y: 24, class: "col-head" }, nodeLayer);
      const s = el("tspan", { class: "step" }, t);
      s.textContent = n + "  ";
      t.appendChild(document.createTextNode(label));
    };
    head(SRC_X, "1", "COLLECT SKILLS");
    head(OMG_X, "2", "ORGANIZE IN AN OMG");
    head(AG_X, "3", "SEND TO AGENTS");

    // Agents
    let y = TOP;
    const boxes = {};
    for (const a of AGENTS) {
      const rows = wrapChips(a.skills, AG_W - 2 * PAD);
      const h = HEAD + rows.length * CH + (rows.length - 1) * RG + PAD;
      boxes[a.id] = { y, h, rows };
      y += h + GAP;
    }
    const agentsBottom = y - GAP;

    // OMGs, centered on the agents each one feeds
    const omgBoxes = {};
    let minTop = TOP;
    for (const o of Object.keys(OWNERS)) {
      const names = Object.keys(SKILLS).filter((n) => SKILLS[n].owner === o);
      const h = listHeight(names.length);
      const fed = AGENTS.filter((a) => a.owners.includes(o)).map((a) => boxes[a.id]);
      const mid = (fed[0].y + fed[fed.length - 1].y + fed[fed.length - 1].h) / 2;
      const top = Math.max(minTop, mid - h / 2);
      omgBoxes[o] = { y: top, h, names };
      minTop = top + h + 28;
    }
    const contentBottom = Math.max(agentsBottom, minTop - 28);

    // Sources, centered vertically against everything else
    const srcHeights = SOURCES.map((s) => listHeight(s.skills.length));
    const srcTotal = srcHeights.reduce((a, b) => a + b, 0) + 28 * (SOURCES.length - 1);
    let sy = Math.max(TOP, TOP + (contentBottom - TOP - srcTotal) / 2);
    const rowPos = {};
    SOURCES.forEach((src, i) => {
      const h = srcHeights[i];
      const g = el("g", { class: "source" }, nodeLayer);
      el("rect", { class: "card", x: SRC_X, y: sy, width: SRC_W, height: h, rx: 12 }, g);
      txt(g, SRC_X + PAD, sy + 24, src.kicker.toUpperCase(), "kicker");
      txt(g, SRC_X + PAD, sy + 45, src.title, "card-title");
      src.skills.forEach((name, k) => {
        const ry = sy + HEAD + k * (CH + RG);
        chip(g, name, SRC_X + PAD, ry, true);
        const a = txt(g, SRC_X + SRC_W - PAD, ry + 17.5, PEOPLE[SKILLS[name].author].name, "author", "end");
        a.setAttribute("data-skill", name);
        rowPos[name] = { src: ry + CH / 2 };
      });
      sy += h + 28;
    });
    const H = Math.max(contentBottom, sy - 28) + 20;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    for (const [o, b] of Object.entries(omgBoxes)) {
      const g = el("g", { class: "omg " + o }, nodeLayer);
      el("rect", { class: "card", x: OMG_X, y: b.y, width: OMG_W, height: b.h, rx: 12 }, g);
      el("circle", { class: "dot " + o, cx: OMG_X + PAD + 4, cy: b.y + 20, r: 4 }, g);
      txt(g, OMG_X + PAD + 14, b.y + 24, OWNERS[o].who.toUpperCase(), "kicker");
      txt(g, OMG_X + PAD, b.y + 45, OWNERS[o].omg, "card-title");
      b.names.forEach((name, i) => {
        const ry = b.y + HEAD + i * (CH + RG);
        chip(g, name, OMG_X + PAD, ry);
        const n = agentsWith(name).length;
        const c = txt(g, OMG_X + OMG_W - PAD, ry + 17.5, `→ ${plural(n, "agent")}`, "count", "end");
        c.setAttribute("data-skill", name);
        // Collect link: source row -> this OMG row
        const cv = curve(SRC_X + SRC_W, rowPos[name].src, OMG_X - 2, ry + CH / 2);
        const lg = el("g", { class: "link collect " + o, "data-skills": name }, linkLayer);
        el("path", { d: cv.d, "marker-end": `url(#arrow-${o})` }, lg);
      });
    }

    for (const a of AGENTS) {
      const b = boxes[a.id];
      const shared = a.owners.length > 1;
      const g = el("g", {
        class: "agent" + (shared ? " shared" : ""), "data-agent": a.id, tabindex: 0, role: "button",
        "aria-label": `${a.kind} ${a.name} with ${plural(a.skills.length, "skill")}: ${a.skills.join(", ")}`,
      }, nodeLayer);
      const body = el("g", { class: "card-body" }, g);
      el("rect", { class: "card", x: AG_X, y: b.y, width: AG_W, height: b.h, rx: 12 }, body);
      let dx = AG_X + PAD;
      for (const o of a.owners) { el("circle", { class: "dot " + o, cx: dx + 4, cy: b.y + 20, r: 4 }, body); dx += 11; }
      txt(body, dx + 3, b.y + 24, a.kind.toUpperCase(), "kicker");
      txt(body, AG_X + PAD, b.y + 45, a.name, "card-title");
      b.rows.forEach((row, ri) => {
        let cx = AG_X + PAD;
        for (const c of row) { chip(g, c.name, cx, b.y + HEAD + ri * (CH + RG)); cx += c.w + CG; }
      });

      a.owners.forEach((o, i) => {
        const ob = omgBoxes[o];
        const out = AGENTS.filter((x) => x.owners.includes(o));
        const k = out.indexOf(a);
        const sx = OMG_X + OMG_W, sy0 = ob.y + 34 + ((k + 0.5) * (ob.h - 68)) / out.length;
        const ex = AG_X - 2, ey = b.y + b.h / 2 + (shared ? (i - (a.owners.length - 1) / 2) * 26 : 0);
        const mine = a.skills.filter((n) => SKILLS[n].owner === o);
        const cv = curve(sx, sy0, ex, ey);
        const lg = el("g", { class: "link send " + o, "data-agent": a.id, "data-skills": mine.join(" ") }, linkLayer);
        el("path", { d: cv.d, "marker-end": `url(#arrow-${o})` }, lg);
        const [lx, ly] = cv.at(0.66);
        txt(lg, lx, ly + 4, shared ? `${mine.length} from ${OWNERS[o].short}` : plural(mine.length, "skill"), "", "middle");
      });
    }
  }

  // Tracing
  const all = (sel) => svg.querySelectorAll(sel);
  const mark = (sel) => all(sel).forEach((n) => n.classList.add("on"));
  function clear() {
    svg.classList.remove("focusing");
    all(".on").forEach((n) => n.classList.remove("on"));
  }
  function focusSkill(name) {
    clear();
    svg.classList.add("focusing");
    mark(`[data-skill="${name}"]`);
    const hits = agentsWith(name);
    hits.forEach((a) => mark(`.agent[data-agent="${a.id}"]`));
    all(".link").forEach((l) => { if (l.dataset.skills.split(" ").includes(name)) l.classList.add("on"); });
    const s = SKILLS[name];
    const by = s.author === "you" ? "written by you" : `by ${PEOPLE[s.author].name}`;
    status.innerHTML = `<b>${name}</b> ${by} is collected once into ${OWNERS[s.owner].ref} and reaches ${plural(hits.length, "agent")}: ${hits.map(agentLabel).join(", ")}.`;
  }
  function focusAgent(id) {
    clear();
    svg.classList.add("focusing");
    const a = AGENTS.find((x) => x.id === id);
    const card = svg.querySelector(`.agent[data-agent="${id}"]`);
    card.classList.add("on");
    card.querySelectorAll(".chip").forEach((n) => n.classList.add("on"));
    a.skills.forEach((n) => {
      mark(`.source [data-skill="${n}"], .omg [data-skill="${n}"], .link.collect[data-skills="${n}"]`);
    });
    mark(`.link[data-agent="${id}"]`);
    const authors = [...new Set(a.skills.map((n) => SKILLS[n].author))].length;
    const from = a.owners.map((o) => OWNERS[o].ref).join(" and ");
    const label = agentLabel(a).replace(/^./, (c) => c.toUpperCase());
    status.textContent = `${label} gets ${plural(a.skills.length, "skill")} by ${plural(authors, "author")}, sent from ${from}.`;
  }
  const rest = () => { clear(); status.textContent = REST; };
  function handle(target) {
    const c = target.closest && target.closest(".chip");
    if (c) return focusSkill(c.dataset.skill);
    const a = target.closest && target.closest(".agent");
    if (a) return focusAgent(a.dataset.agent);
    rest();
  }
  svg.addEventListener("pointerover", (e) => handle(e.target));
  svg.addEventListener("pointerleave", rest);
  svg.addEventListener("focusin", (e) => handle(e.target));
  svg.addEventListener("focusout", (e) => { if (!svg.contains(e.relatedTarget)) rest(); });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
