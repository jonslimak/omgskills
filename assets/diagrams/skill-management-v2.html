<title>One Library, Every Agent v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --chip: #f2f2f7;
    --float: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --faint: #aeaeb2;
    --link: #c7c7cc;
    --hair: #e5e5ea;
    --shadow: rgba(0, 0, 0, 0.09);
    --shadow-soft: rgba(0, 0, 0, 0.06);
    --track: #e3e3e8;
    --logo-filter: none;
    --update: #248a3d;
    --on-update: #ffffff;
    --update-tint: rgba(52, 199, 89, 0.22);
    --create: #0a84ff;
    --created-tag: #ff3b30;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --chip: #2c2c2e;
      --float: #2c2c2e;
      --ink: #f5f5f7;
      --muted: #98989d;
      --faint: #636366;
      --link: #48484a;
      --hair: #38383a;
      --shadow: rgba(0, 0, 0, 0.5);
      --shadow-soft: rgba(0, 0, 0, 0.3);
      --track: #1c1c1e;
      --logo-filter: invert(1);
      --update: #30d158;
      --on-update: #002b0c;
      --update-tint: rgba(48, 209, 88, 0.26);
      --create: #409cff;
      --created-tag: #ff453a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --chip: #2c2c2e;
    --float: #2c2c2e;
    --ink: #f5f5f7;
    --muted: #98989d;
    --faint: #636366;
    --link: #48484a;
    --hair: #38383a;
    --shadow: rgba(0, 0, 0, 0.5);
    --shadow-soft: rgba(0, 0, 0, 0.3);
    --track: #1c1c1e;
    --logo-filter: invert(1);
    --update: #30d158;
    --on-update: #002b0c;
    --update-tint: rgba(48, 209, 88, 0.26);
    --create: #409cff;
    --created-tag: #ff453a;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.47;
    -webkit-font-smoothing: antialiased;
    padding-inline: 20px;
    padding-block: 32px 44px;
  }
  .stage { max-width: 842px; margin: 0 auto; display: grid; gap: 6px; }

  .story { display: grid; gap: 8px; justify-items: center; text-align: center; }
  .ticker { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 1.6em; }
  .ticker p {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(15px, 2.4vw, 21px);
    line-height: 1.15;
    letter-spacing: -0.022em;
    font-weight: 600;
    color: var(--ink);
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .ticker p.out { opacity: 0; transform: translateY(6px); }

  /* Extra room so the soft card shadows are not clipped by the scroll box */
  /* The drawing scales down to 680px wide; below that it stays centred and is cropped
     evenly on both sides instead of scrolling. Extra padding keeps card shadows unclipped. */
  .scroll {
    display: flex; justify-content: center; overflow: hidden;
    padding-block: 48px; margin-block: -48px;
  }
  @media (min-width: 950px) { .scroll { padding-inline: 48px; margin-inline: -48px; } }
  @media (max-width: 949px) { .scroll { margin-inline: -20px; } } /* crop at the screen edge, not the page gutter */
  #flow { display: block; flex: 0 0 auto; width: max(100%, 680px); height: auto; overflow: visible; }

  /* SVG */
  #flow text { fill: var(--ink); font-family: var(--sans); }
  #flow .card { fill: var(--card); }
  #flow .card.agent-card { fill: transparent; }
  #flow .agent-head { transform-box: fill-box; transform-origin: 20% 60%; }
  #flow .you-head { transform-box: fill-box; transform-origin: 50% 70%; }
  /* On a pure white page the cards are defined only by their shadow */
  #flow .lift { filter: drop-shadow(0 1px 2px var(--shadow-soft)) drop-shadow(0 8px 24px var(--shadow)); }
  #flow .lift-hero { filter: drop-shadow(0 2px 4px var(--shadow-soft)) drop-shadow(0 20px 48px var(--shadow)); }
  /* Card names and counts match the agent cards' name and "Personal" label */
  #flow .omg-title, #flow .mate-title { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: -0.015em; }
  #flow .omg-sub { fill: var(--muted); font-size: 10px; }
  #flow .agent-title { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: -0.015em; }
  #flow .agent-sub, #flow .group-cap { fill: var(--muted); font-size: 12.5px; }
  #flow .agent-sub { font-size: 10px; }
  #flow .group-cap { font-size: 11.5px; font-weight: 500; }
  #flow .hair { stroke: var(--hair); stroke-width: 1; }
  #flow .handle { fill: var(--muted); font-size: 12px; }

  #flow .chip .bg { fill: var(--chip); }
  #flow .chip.float .bg { fill: var(--float); }
  #flow .chip.float { filter: drop-shadow(0 1px 1px var(--shadow-soft)) drop-shadow(0 4px 10px var(--shadow)); }
  #flow .chip .name { font-size: 12px; font-weight: 500; }
  #flow .chip .count text { fill: var(--muted); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  #flow .chip .bot { fill: none; stroke: var(--faint); stroke-width: 2; stroke-linecap: round; }
  #flow .chip .bot-eye { fill: var(--faint); }
  #flow .chip .lock { fill: none; stroke: var(--muted); stroke-width: 1.3; }
  #flow .avatar-ring { fill: none; stroke: var(--hair); stroke-width: 0.75; }
  #flow .glyph { fill: #ffffff; }
  #flow .logo-mark { fill: var(--ink); }
  #flow .logo-img { filter: var(--logo-filter); }

  /* Links are rows of dots that flow toward where the skill is going */
  #flow .link path {
    fill: none; stroke: var(--link); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 0 8; animation: flow 0.55s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -8; } }
  #flow .arrowhead path { fill: var(--link); }
  #flow .link text {
    fill: var(--muted); font-size: 11.5px; font-weight: 500;
    stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; paint-order: stroke;
  }


  /* Motion */
  #flow .anim { transition: transform 900ms cubic-bezier(0.22, 0.8, 0.24, 1), opacity 450ms ease; }
  #flow .link { transition: opacity 400ms ease; }
  @media (prefers-reduced-motion: reduce) { #flow .link path { animation: none; } }
  #flow.instant .anim, #flow.instant .link, #flow.instant .link path { transition: none !important; }
  #flow .chip .bg { transition: fill 500ms ease, stroke 400ms ease; }
  #flow .chip.flash .bg { fill: var(--update-tint); }
  #flow .badge rect { fill: var(--update); }
  #flow .badge text { fill: var(--on-update); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; }
  #flow .chip.float .bg { stroke: transparent; stroke-width: 1.5; }
  /* Skill creation moment: Apple blue pill, white text, red "Created" tag */
  #flow .chip.float.create .bg { fill: var(--create); }
  #flow .chip .name { transition: fill 400ms ease; }
  #flow .chip.create .name { fill: #ffffff; }
  #flow .chip.create .lock { stroke: #ffffff; }
  #flow .badge.create rect { fill: var(--created-tag); }
  #flow .badge.create text { fill: #ffffff; }
  #flow .link.sync path { stroke: var(--update); }
  #flow .link.relay path { stroke: var(--create); }
  #flow .pulse { fill: none; stroke: var(--update); stroke-width: 0; stroke-linejoin: round; pointer-events: none; }
  #flow .arrowhead.sync path { fill: var(--update); }
  #flow .badge.author rect { fill: var(--ink); }
  #flow .badge.author text { fill: var(--bg); font-weight: 500; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  #flow .bob { animation: bob 4s ease-in-out infinite; }
  #flow .cloud .bob > .chip {
    transform-box: fill-box; transform-origin: center;
    transition: opacity 300ms ease, transform 500ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }
  /* Unpicked skills stay faded and 40% smaller, so the cloud reads as background until one is chosen */
  #flow .cloud .cloud-chip:not(.picked) .bob > .chip { opacity: 0.35; transform: scale(0.6); }
  @media (prefers-reduced-motion: reduce) { #flow .bob { animation: none; } }
  #flow.tracing .chip:not(.hit) { opacity: 0.2 !important; }
</style>

  </div>
</div>

    ["code-review", 320, 72], ["napkin", 540, 84],
    ["grill-me", 150, 190], ["swiftui-pro", 105, 285], ["gstack", 175, 380],
    ["humanizer", 700, 200], ["mcp-builder", 755, 295], ["swiftdata-pro", 690, 390],
  ];
  const EVENTS = [
    { phase: "Find the best, trusted skills", who: "you", collect: "grill-me", send: ["hermes"] },
    { who: "you", collect: "swiftui-pro", send: ["chatgpt"] },
    // Made inside your personal ChatGPT, saved up to your library, then shared to other agents
    { phase: "Keep track of personal ones", who: "you", createOn: "chatgpt", collect: "release-notes", send: ["team-chatgpt", "hermes"] },
    { who: "you", collect: "humanizer", send: ["chatgpt", "claude"] },
    // The teammate already has frontend-design in their library; they just send it
    { phase: "Share them with your team", who: "mate", reuse: "frontend-design", send: ["team-chatgpt"] },
    { who: "mate", collect: "brand-voice", send: ["team-chatgpt"] },
    { who: "you", reuse: "humanizer", send: ["team-chatgpt"] },
    { phase: "Keep everything updated", who: "you", update: "release-notes" },
  ];

  // ---- Geometry
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("flow");
  const ticker = document.getElementById("ticker");
  const AG_GAP = 4, AG_W = 170, AG_HEAD = 56;
  const CH = 32, CG = 8, M = 20;
  const W = 842; // drawing width stays fixed; the agent row is centred in it
  const OMG_W = 248, OMG_X = (W - OMG_W) / 2, OMG_Y = 150, ROW_Y = 136;
  const MATE_W = 222, MATE_X = W - M - MATE_W, MATE_Y = 262, M_ROW = 108;
  // Rows your card ends up with: your own collects plus every teammate skill relayed through it
  const youCollects = EVENTS.filter((e) => (e.who === "you" && e.collect) || (e.who === "mate" && (e.collect || e.reuse))).length;
  const cardH = (head, n) => (n ? head + n * (CH + CG) - CG + 20 : head - 2);
  const AG_Y = OMG_Y + cardH(ROW_Y, youCollects) + 80;
  const AG_X0 = (W - (4 * AG_W + 3 * AG_GAP)) / 2;
  const agentX = (i) => AG_X0 + i * (AG_W + AG_GAP);

  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const txt = (parent, x, y, s, cls, anchor) => {
    const t = el("text", { x, y, class: cls || "" }, parent);
    if (anchor) t.setAttribute("text-anchor", anchor);
    t.textContent = s;
    return t;
  };
  const place = (node, x, y, opacity) => {
    node.style.transform = `translate(${x}px, ${y}px)`;
    if (opacity != null) node.style.opacity = opacity;
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  let measurer;
  const textW = (s) => { measurer.textContent = s; return Math.ceil(measurer.getComputedTextLength()); };
  const chipW = (name) => textW(name) + 48 + (SKILLS[name].private ? 16 : 0);

  function placeholder(g, cx, cy, r) {
    el("circle", { cx, cy, r, fill: "url(#ph)" }, g);
    el("circle", { class: "glyph", cx, cy: cy - r * 0.2, r: r * 0.34 }, g);
    const w = r * 0.62;
    el("path", { class: "glyph", d: `M${cx - w} ${cy + r * 0.72}a${w} ${w * 0.86} 0 0 1 ${2 * w} 0z` }, g);
  }
  function avatar(g, who, cx, cy, r) {
    const p = PEOPLE[who];
    if (p.img) {
      el("image", { href: p.img, x: cx - r, y: cy - r, width: 2 * r, height: 2 * r, "clip-path": "url(#round)", preserveAspectRatio: "xMidYMid slice" }, g);
      el("circle", { class: "avatar-ring", cx, cy, r }, g);
    } else {
      placeholder(g, cx, cy, r);
    }
  }
  function logo(g, key, cx, cy, r) {
    const L = LOGOS[key];
    if (L.img) {
      el("image", { class: "logo-img", href: L.img, x: cx - r, y: cy - r, width: 2 * r, height: 2 * r, preserveAspectRatio: "xMidYMid meet" }, g);
    } else {
      const size = r * 1.6, k = size / 24;
      el("path", { class: "logo-mark", d: L.path, transform: `translate(${cx - size / 2} ${cy - size / 2}) scale(${k})` }, g);
    }
  }

  // A skill pill, drawn at the origin and moved with CSS transforms.
  function chip(parent, name, opts = {}) {
    const s = SKILLS[name];
    const tw = textW(name);
    const w = opts.w || chipW(name);
    const g = el("g", { class: `chip anim${opts.float ? " float" : ""}`, "data-skill": name }, parent);
    el("rect", { class: "bg", width: w, height: CH, rx: CH / 2 }, g);
    avatar(g, s.author, 17, CH / 2, 11);
    txt(g, 35, CH / 2 + 4.5, name, "name");
    if (s.private) {
      const cx = 35 + tw + 11, cy = CH / 2 + 1;
      el("rect", { class: "lock", x: cx - 4, y: cy - 1, width: 8, height: 6, rx: 1.2 }, g);
      el("path", { class: "lock", d: `M${cx - 2.5} ${cy - 1}V${cy - 3.5}A2.5 2.5 0 0 1 ${cx + 2.5} ${cy - 3.5}V${cy - 1}` }, g);
    }
    if (opts.count) {
      const cg = el("g", { class: "count anim", style: "opacity:0" }, g);
      const bx = w - 20, bot = el("g", { transform: `translate(${bx} ${CH / 2 - 2}) scale(0.5)` }, cg);
      el("rect", { class: "bot", x: 0, y: 0, width: 12, height: 10, rx: 3 }, bot);
      el("path", { class: "bot", d: "M6 0v-2.5" }, bot);
      el("circle", { class: "bot-eye", cx: 6, cy: -3.4, r: 1.5 }, bot);
      el("circle", { class: "bot-eye", cx: 3.8, cy: 4.8, r: 1.5 }, bot);
      el("circle", { class: "bot-eye", cx: 8.2, cy: 4.8, r: 1.5 }, bot);
      g.countG = cg;
      g.countT = txt(cg, bx - 3, CH / 2 + 4.5, "0", "", "end");
    }
    return g;
  }

  function curve(sx, sy, ex, ey) {
    const c = (ey - sy) * 0.55;
    return `M${sx} ${sy}C${sx} ${sy + c} ${ex} ${ey - c} ${ex} ${ey}`;
  }

  // ---- Timing helpers (pausable)
  let instant = false;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frame = () => {
    void svg.getBoundingClientRect(); // commit start positions before animating
    return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  };
  async function sleep(ms) {
    if (instant) return;
    let t = 0;
    while (t < ms) {
      await new Promise((r) => setTimeout(r, 50));
      if (!document.hidden) t += 50;
    }
  }
  function tweenH(rect, to, dur = 520) {
    rect.dataset.h = to;
    const from = +rect.getAttribute("height");
    if (instant) { rect.setAttribute("height", to); return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      rect.setAttribute("height", from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  // High-level phase shown above the diagram, set per event in EVENTS
  let phaseNow = "";
  function phase(text) {
    if (!ticker) return; // the headline is not shown in v2
    if (text === phaseNow) return;
    phaseNow = text;
    if (instant) { ticker.textContent = text; return; }
    ticker.classList.add("out");
    setTimeout(() => { ticker.textContent = text; ticker.classList.remove("out"); }, 200);
  }

  // ---- Scene
  let layers, you, mate, agents, measurerReady = false;

  function build() {
    svg.textContent = "";
    measurer = el("text", { x: -999, y: -999, style: "font: 500 12px var(--sans)" }, svg);
    const defs = el("defs", {}, svg);
    const clip = el("clipPath", { id: "round", clipPathUnits: "objectBoundingBox" }, defs);
    el("circle", { cx: 0.5, cy: 0.5, r: 0.5 }, clip);
    const grad = el("linearGradient", { id: "ph", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el("stop", { offset: 0, "stop-color": "#a5aab4" }, grad);
    el("stop", { offset: 1, "stop-color": "#858a94" }, grad);
    const m = el("marker", { id: "arrow", class: "arrowhead", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" }, defs);
    el("path", { d: "M0,1 L9,5 L0,9 z" }, m);
    const ms = el("marker", { id: "arrow-sync", class: "arrowhead sync", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" }, defs);
    el("path", { d: "M0,1 L9,5 L0,9 z" }, ms);
    // The cloud sits behind the cards, so the teammate card can cover part of it
    layers = { link: el("g", {}, svg), under: el("g", {}, svg), cloud: el("g", { class: "cloud" }, svg), card: el("g", {}, svg), chip: el("g", {}, svg) };

    // You: the hero card
    const yg = el("g", { class: "anim" }, layers.card);
    place(yg, OMG_X, OMG_Y, 1);
    const yFace = el("g", { class: "lift-hero" }, yg);
    const yRect = el("rect", { class: "card", x: 0, y: 0, width: OMG_W, height: cardH(ROW_Y, 0), rx: 24 }, yFace);
    const yPop = el("g", { class: "you-head" }, yg); // avatar + name, bounced when a skill comes in
    avatar(yPop, "you", OMG_W / 2, 56, 34);
    txt(yPop, OMG_W / 2, 110, "you", "omg-title", "middle");
    const ySub = txt(yg, OMG_W / 2, 123, "", "omg-sub", "middle");
    you = { key: "you", g: yg, rect: yRect, sub: ySub, rows: [], x: OMG_X, y: OMG_Y, w: OMG_W, head: ROW_Y, pop: yPop };

    // Teammate: smaller card, joins later
    const mg = el("g", { class: "anim" }, layers.card);
    layers.card.insertBefore(mg, yg); // drawn behind your card so it can swing out from under it
    const mFace = el("g", { class: "lift" }, mg);
    const mRect = el("rect", { class: "card", x: 0, y: 0, width: MATE_W, height: cardH(M_ROW, 0), rx: 20 }, mFace);
    const mPop = el("g", { class: "you-head" }, mg); // avatar + name, bounced when an update syncs in
    avatar(mPop, "sam", MATE_W / 2, 42, 24);
    txt(mPop, MATE_W / 2, 84, "teammate", "mate-title", "middle");
    const mSub = txt(mg, MATE_W / 2, 97, "", "omg-sub", "middle");
    mate = { key: "mate", g: mg, rect: mRect, sub: mSub, rows: [], x: MATE_X, y: MATE_Y, w: MATE_W, head: M_ROW, shown: false, pop: mPop };
    mateVisible(false);

    // Agents
    agents = {};
    AGENTS.forEach((a, i) => {
      const g = el("g", { class: "anim" }, layers.card);
      const x = agentX(i);
      place(g, x, AG_Y, 1);
      // Agent cards have no fill or shadow; the rect only tracks the card's size
      const face = el("g", {}, g);
      const rect = el("rect", { class: "card agent-card", x: 0, y: 0, width: AG_W, height: AG_HEAD + 2, rx: 18 }, face);
      const head = el("g", { class: "agent-head" }, g); // logo + name, bounced when a skill arrives
      logo(head, a.logo, 28, 30, 12);
      txt(head, 47, 28, a.name, "agent-title");
      const sub = txt(head, 47, 41, a.kind, "agent-sub");
      agents[a.id] = { ...a, i, g, head, rect, sub, x, items: [], caps: {} };
    });

    const finalH = Math.max(...AGENTS.map((a) => {
      const n = EVENTS.filter((e) => (e.send || []).includes(a.id) || e.createOn === a.id).length;
      return AG_HEAD + n * (CH + CG) + (a.shared ? 22 + 6 : 0) + 20;
    }));
    svg.setAttribute("viewBox", `0 0 ${W} ${AG_Y + finalH + 24}`);
    seedMate();
    refreshSubs();
    makeCloud();
  }

  // Skills the teammate already has before the story starts
  const MATE_START = ["frontend-design"];
  function seedMate() {
    MATE_START.forEach((name, i) => {
      const row = chip(mate.g, name, { w: mate.w - 32, count: true });
      row.classList.remove("anim");
      row.style.transition = "none";
      place(row, 16, mate.head + i * (CH + CG), 1);
      mate.rows.push({ name, el: row, n: 0, inCard: true });
    });
    const h = cardH(M_ROW, mate.rows.length);
    mate.rect.setAttribute("height", h);
    mate.rect.dataset.h = h;
  }

  // ---- The cloud of discoverable skills
  let cloud = {};
  function makeCloud() {
    layers.cloud.textContent = "";
    cloud = {};
    CLOUD.forEach(([name, cx, y], i) => {
      const w = chipW(name), x = cx - w / 2;
      const holder = el("g", { class: "anim cloud-chip" }, layers.cloud);
      const bob = el("g", { class: "bob", style: `animation-delay:${-(i * 0.7) % 4}s; animation-duration:${3.6 + (i % 3) * 0.5}s` }, holder);
      const c = chip(bob, name, { float: true });
      c.classList.remove("anim");
      holder.style.transition = "opacity 500ms ease"; // no movement on entry, only a fade
      place(holder, x, y, 0);
      cloud[name] = { holder, bob, c, x, y, w };
    });
    void svg.getBoundingClientRect();
    Object.values(cloud).forEach((e, i) => {
      e.holder.style.transitionDelay = instant ? "0ms" : `${i * 60}ms`;
      place(e.holder, e.x, e.y, 1);
    });
  }

  function refreshSubs() {
    for (const o of [you, mate]) {
      const reach = new Set(Object.values(agents).filter((a) => a.items.some((it) => it.who === o.key)).map((a) => a.id)).size;
      o.sub.textContent = plural(o.rows.length, "skill") + (reach ? ` · ${plural(reach, "agent")}` : "");
    }
  }

  // Row slot inside an OMG card
  const rowPos = (o, i) => ({ x: o.x + 16, y: o.y + o.head + i * (CH + CG) });
  const omgBottom = (o) => o.y + +(o.rect.dataset.h || o.rect.getAttribute("height"));

  // Lay out an agent's skills, grouping by sender on the shared agent
  function layoutAgent(a) {
    let y = AG_HEAD;
    const groups = [];
    for (const it of a.items) {
      let g = groups.find((x) => x.who === it.who);
      if (!g) { g = { who: it.who, items: [] }; groups.push(g); }
      g.items.push(it);
    }
    const ordered = a.shared ? groups : [{ who: null, items: a.items }];
    ordered.forEach((g, gi) => {
      // Only the teammate's group gets a caption; your skills need no label
      if (a.shared && g.who === "mate") {
        let cap = a.caps[g.who];
        if (!cap) {
          cap = a.caps[g.who] = txt(layers.chip, 0, 0, "From teammate", "group-cap anim");
          place(cap, a.x + 16, AG_Y + y + 12, 0);
        }
        cap.pos = { x: a.x + 16, y: AG_Y + y + 12 };
        y += 22;
      }
      for (const it of g.items) { it.pos = { x: a.x + 12, y: AG_Y + y }; y += CH + CG; }
      if (a.shared && gi < ordered.length - 1) y += 6;
    });
    const h = a.items.length ? y - CG + 16 : AG_HEAD + 2;
    return h;
  }

  // ---- Actions
  // Is this skill written by the card's own person? Then it hatches from the card.
  const madeBy = (o, name) => SKILLS[name].author === (o.key === "you" ? "you" : "sam");

  async function spawnAndCollect(o, name) {
    const w = chipW(name);
    const hatch = madeBy(o, name);
    let holder = el("g", { class: "anim" }, layers.chip);
    const c = chip(holder, name, { float: true });
    c.classList.remove("anim");
    let sx, sy, h = null, created = null;

    if (hatch) {
      // Rises from behind the card's top edge, white with a green outline and a "Created" badge
      holder.classList.remove("anim");
      holder.remove();
      layers.under.appendChild(holder);
      c.classList.add("create");
      sx = o.x + o.w / 2 - w / 2;
      sy = o.y - CH - 26;
      const startT = `translate(${sx}px, ${o.y + 12}px)`;
      const endT = `translate(${sx}px, ${sy}px)`;
      holder.style.transform = endT;
      holder.style.opacity = 1;
      holder.animate(
        [{ transform: startT }, { transform: `translate(${sx}px, ${sy - 8}px)`, offset: 0.72 }, { transform: endT }],
        { duration: instant ? 0 : 850, easing: "cubic-bezier(0.25, 0.9, 0.3, 1)" }
      );
      await sleep(450);
      created = badge(sx + w + 6, sy - 10, "Created", false, "create");
      await frame();
      created.show();
      await sleep(1000);
      holder.classList.add("anim");
      void holder.getBoundingClientRect();
    } else {
      // Picked out of the floating cloud: it is drawn toward your card and shows its author
      holder.remove();
      const e = cloud[name];
      delete cloud[name];
      holder = e.holder;
      const pull = (OMG_X + OMG_W / 2 - (e.x + e.w / 2)) * 0.25;
      sx = e.x + pull; sy = e.y - 4;
      layers.cloud.classList.add("picking");
      holder.classList.add("picked");
      holder.style.transition = ""; // back to the normal move + fade transition
      holder.style.transitionDelay = "0ms";
      place(holder, sx, sy, 1);
      // Author shown as a small dark tag on the chip's corner
      const tag = badge(sx + e.w + 6, sy - 10, PEOPLE[SKILLS[name].author].handle, false, "author");
      h = tag.g;
      await frame();
      tag.show();
      await sleep(900);
      layers.cloud.classList.remove("picking");
    }

    // Absorb into the card: the floating pill hands off to a row pill
    const i = o.rows.length;
    const row = chip(layers.chip, name, { w: o.w - 32, count: true });
    place(row, sx, sy, 0);
    o.rows.push({ name, el: row, n: 0 });
    tweenH(o.rect, cardH(o.head, o.rows.length));
    if (o === mate) alignMate(true); // the card grows around its centre
    const slot = rowPos(o, i);
    await frame();
    if (h) h.style.opacity = 0;
    if (created) { created.g.style.opacity = 0; c.classList.remove("create"); }
    place(holder, slot.x, slot.y, 0);
    place(row, slot.x, slot.y, 1);
    refreshSubs();
    await sleep(650);
    holder.remove();
    if (created) created.g.remove();
    if (h && h.classList.contains("badge")) h.remove();
    // Teammate rows live inside their card from here on, so they swing in and out with it
    if (o === mate) {
      const r = mate.rows[i];
      row.classList.remove("anim");
      row.style.transition = "none";
      row.style.transitionDelay = "0ms";
      mate.g.appendChild(row);
      place(row, 16, mate.head + i * (CH + CG), 1);
      r.inCard = true;
    }
  }


  // A skill written inside an agent: it pops up in that agent with a "Created" badge,
  // then travels up along flowing dots into your library
  async function createOnAgent(o, name, agentId) {
    const a = agents[agentId];
    const w = chipW(name);
    // Starts behind the agent's logo and name (drawn under them), same look as a teammate creation
    const c = chip(layers.under, name, { float: true });
    c.classList.remove("anim");
    c.classList.add("create");
    a.items.push({ name, who: o.key, el: c });
    const h = layoutAgent(a);
    const it = a.items[a.items.length - 1];
    const sx = it.pos.x, sy = AG_Y - CH - 16; // just above the agent's name
    c.style.transformBox = "fill-box";
    c.style.transformOrigin = "center";
    c.style.transform = `translate(${sx}px, ${sy}px)`;
    c.style.opacity = 1;
    c.animate(
      [
        { transform: `translate(${sx}px, ${AG_Y + 14}px) scale(0.55)`, opacity: 0 },
        { transform: `translate(${sx}px, ${AG_Y + 4}px) scale(0.7)`, opacity: 1, offset: 0.2 },
        { transform: `translate(${sx}px, ${sy - 8}px) scale(1.03)`, offset: 0.72 },
        { transform: `translate(${sx}px, ${sy}px) scale(1)` },
      ],
      { duration: instant ? 0 : 850, easing: "cubic-bezier(0.25, 0.9, 0.3, 1)" }
    );
    activate(a);
    await sleep(450);
    const tag = badge(sx + w + 6, sy - 10, "Created", false, "create");
    await frame();
    tag.show();
    await sleep(1000);

    // Settles down into its slot in the agent, turning into a normal skill as it moves.
    // Explicit keyframes keep the glide smooth; the badge fades and is removed.
    tag.g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" }).onfinish = () => tag.g.remove();
    c.classList.remove("create", "float");
    c.style.transition = "none";
    tweenH(a.rect, h);
    const landed = `translate(${it.pos.x}px, ${it.pos.y}px)`;
    c.style.transform = landed;
    const glide = c.animate(
      [{ transform: `translate(${sx}px, ${sy}px)` }, { transform: landed }],
      { duration: instant ? 0 : 650, easing: "cubic-bezier(0.45, 0, 0.2, 1)" }
    );
    await glide.finished;
    layers.chip.appendChild(c); // in front of the agent from here on
    c.style.transformBox = "";
    c.style.transformOrigin = "";
    c.classList.add("anim");
    c.style.transition = "";

    // Up into your card
    const i = o.rows.length;
    const row = chip(layers.chip, name, { w: o.w - 32, count: true });
    place(row, it.pos.x, it.pos.y, 0);
    o.rows.push({ name, el: row, n: 1 });
    tweenH(o.rect, cardH(o.head, o.rows.length));
    const slot = rowPos(o, i);
    const lg = el("g", { class: "link relay", style: "opacity:0" }, layers.link); // blue: a new skill saved to your library
    el("path", { d: curve(a.x + AG_W / 2, AG_Y - 6, o.x + o.w * (a.i + 1) / (AGENTS.length + 1), omgBottom(o) + 4) }, lg);
    await frame();
    lg.style.opacity = 1;
    place(row, slot.x, slot.y, 1);
    if (!instant) setTimeout(() => activate(you), 380); // your card reacts as the skill arrives
    await sleep(650);
    row.countT.textContent = "1";
    row.countG.style.opacity = 1;
    refreshSubs();
    await sleep(500);
    lg.style.opacity = 0;
    tag.g.remove();
    setTimeout(() => lg.remove(), 450);
  }

  // Side-to-side curve, for links between the teammate card and your card
  function curveH(sx, sy, ex, ey) {
    const c = (sx - ex) * 0.45;
    return `M${sx} ${sy}C${sx - c} ${sy} ${ex + c} ${ey} ${ex} ${ey}`;
  }

  // Teammates never drop skills straight into your agents: they go into your library first
  async function relayToYou(name, targets) {
    const mi = mate.rows.findIndex((r) => r.name === name);
    const from = rowPos(mate, mi);
    const i = you.rows.length;
    const row = chip(layers.chip, name, { w: you.w - 32, count: true });
    place(row, from.x, from.y, 0);
    you.rows.push({ name, el: row, n: 0 });
    tweenH(you.rect, cardH(you.head, you.rows.length));
    const slot = rowPos(you, i);
    // Straight, level line in blue: a teammate handing a skill to your library
    // Level with the landing row, but kept within the teammate card so it leaves from its edge
    const ly = Math.min(Math.max(slot.y + CH / 2, mate.y + 24), mate.y + mateH() - 24);
    const lg = el("g", { class: "link relay", style: "opacity:0" }, layers.link);
    el("path", { d: `M${MATE_X - 6} ${ly}H${you.x + you.w + 6}` }, lg);
    await frame();
    lg.style.opacity = 1;
    place(row, slot.x, slot.y, 1);
    if (!instant) setTimeout(() => activate(you), 380); // your card reacts as the skill arrives
    alignMate(); // your card grew, so keep the teammate centred on it
    const mr = mate.rows[mi];
    mr.n += targets.length;
    mr.el.countT.textContent = mr.n;
    mr.el.countG.style.opacity = 1;
    refreshSubs();
    await sleep(800);
    (async () => { await sleep(250); lg.style.opacity = 0; await sleep(450); lg.remove(); })();
  }

  async function send(o, name, targets, owner) {
    const row = o.rows.find((r) => r.name === name);
    const from = rowPos(o, o.rows.indexOf(row));
    const flights = [];
    for (const id of targets) {
      const a = agents[id];
      const c = chip(layers.chip, name);
      place(c, from.x, from.y, 0);
      a.items.push({ name, who: owner || o.key, el: c });
      const h = layoutAgent(a);
      if (a.shared && owner === "mate") a.sub.textContent = "Work · shared";
      // Transient arrow
      const sx = o.key === "you" ? o.x + o.w * (a.i + 1) / (AGENTS.length + 1) : o.x + o.w / 2;
      const ex = a.x + AG_W / 2 + (a.shared ? (o.key === "you" ? -24 : 24) : 0);
      const lg = el("g", { class: "link", style: "opacity:0" }, layers.link);
      const p = el("path", { d: curve(sx, omgBottom(o), ex, AG_Y - 6) }, lg);
      flights.push({ a, c, h, lg, p });
    }
    await frame();
    // The agent starts to react while the skill is still on its way down
    if (!instant) setTimeout(() => flights.forEach((f) => activate(f.a)), 520);
    for (const f of flights) {
      f.lg.style.opacity = 1;
      tweenH(f.a.rect, f.h);
      for (const it of f.a.items) place(it.el, it.pos.x, it.pos.y, 1);
      for (const cap of Object.values(f.a.caps)) place(cap, cap.pos.x, cap.pos.y, 1);
    }
    await sleep(650);
    row.n += targets.length;
    row.el.countT.textContent = row.n;
    row.el.countG.style.opacity = 1;
    refreshSubs();
    // Arrows fade out in the background while the next action starts
    (async () => {
      await sleep(450);
      for (const f of flights) f.lg.style.opacity = 0;
      await sleep(450);
      for (const f of flights) f.lg.remove();
    })();
    await sleep(250);
  }

  // Single hop of the logo/avatar and name when a skill arrives
  function activate(a) {
    if (instant || reduced) return;
    (a.pop || a.head).animate(
      // Quick lift, soft landing: fast out, gentle ease back, no rebound
      [
        { transform: "translateY(0) scale(1)", offset: 0, easing: "cubic-bezier(0.2, 0.9, 0.3, 1)" },
        { transform: "translateY(-5px) scale(1.045)", offset: 0.32, easing: "cubic-bezier(0.35, 0, 0.25, 1)" },
        { transform: "translateY(0) scale(1)", offset: 1 },
      ],
      { duration: 420 }
    );
  }

  // A small green pill, e.g. "Updated", pinned to the top-right of a skill
  function badge(x, y, label, center, kind) {
    measurer.textContent = label;
    const w = Math.ceil(measurer.getComputedTextLength()) + 14;
    if (center) x += w / 2;
    const g = el("g", { class: `badge anim${kind ? " " + kind : ""}` }, layers.chip);
    el("rect", { width: w, height: 18, rx: 9 }, g);
    txt(g, w / 2, 12.5, label, "", "middle");
    place(g, x - w, y + 4, 0);
    return { g, show: () => place(g, x - w, y, 1) };
  }
  function syncArrow(sx, sy, ex, ey) {
    const lg = el("g", { class: "link sync", style: "opacity:0" }, layers.link);
    el("path", { d: curve(sx, sy, ex, ey) }, lg);
    return { lg, show: () => { lg.style.opacity = 1; } };
  }

  // A soft green glow that swells out from behind the pill and fades, marking the update.
  // It grows by stroke width, so it keeps the pill's rounded shape exactly.
  function pulse(node) {
    if (instant || reduced) return;
    const bg = node.querySelector("rect.bg");
    const glow = el("rect", { class: "pulse", width: bg.getAttribute("width"), height: CH, rx: CH / 2 });
    node.insertBefore(glow, bg); // behind the pill, so only the outer halo shows
    const a = glow.animate(
      [
        { strokeWidth: "0px", opacity: 0.9 },
        { strokeWidth: "16px", opacity: 0.55, offset: 0.35 },
        { strokeWidth: "30px", opacity: 0 },
      ],
      { duration: 950, easing: "cubic-bezier(0.2, 0.8, 0.3, 1)", fill: "both" }
    );
    a.onfinish = () => glow.remove();
  }

  async function update(o, name) {
    const row = o.rows.find((r) => r.name === name);
    const rp = rowPos(o, o.rows.indexOf(row));
    const rowW = o.w - 32;
    const extras = [];

    // 1. The skill changes in your library
    row.el.classList.add("flash");
    pulse(row.el);
    const b0 = badge(rp.x + rowW + 6, rp.y - 10, "Updated");
    extras.push(b0.g);
    await frame();
    b0.show();
    await sleep(1100);

    // 2. It syncs to every agent that has it
    const hits = Object.values(agents).filter((a) => a.items.some((it) => it.name === name));
    const arrows = hits.map((a) => {
      const sx = o.x + o.w * (a.i + 1) / (AGENTS.length + 1);
      const ex = a.x + AG_W / 2 + (a.shared ? -24 : 0);
      const ar = syncArrow(sx, omgBottom(o), ex, AG_Y - 4);
      extras.push(ar.lg);
      return ar;
    });
    await frame();
    arrows.forEach((ar) => ar.show());
    await sleep(600);
    for (const a of hits) {
      const it = a.items.find((x) => x.name === name);
      it.el.classList.add("flash");
      pulse(it.el);
      const b = badge(it.pos.x + chipW(name) + 6, it.pos.y - 10, "Updated");
      extras.push(b.g);
      await frame();
      b.show();
    }
    await sleep(1200);

    // 3. Teammates on a shared agent get it too
    const shared = hits.find((a) => a.shared);
    if (mate.joined) {
      await showMate();
      // The update reaches the teammate through your library, not through the agent
      const ri = o.rows.indexOf(row);
      const ar = syncArrow(0, 0, 0, 0);
      const sy = Math.min(Math.max(rowPos(you, ri).y + CH / 2, mate.y + 24), mate.y + mateH() - 24);
      ar.lg.querySelector("path").setAttribute("d", `M${you.x + you.w + 6} ${sy}H${MATE_X - 6}`);
      extras.push(ar.lg);
      await frame();
      ar.show();
      await sleep(600);
      activate(mate); // the teammate reacts as the update reaches them
      const t = badge(mate.x + mate.w / 2, omgBottom(mate) - 9, "App synced", true);
      extras.push(t.g);
      await frame();
      t.show();
      await sleep(1100);
    }

    // Settle
    for (const n of extras) n.style.opacity = 0;
    svg.querySelectorAll(".chip.flash").forEach((c) => c.classList.remove("flash"));
    await sleep(500);
    extras.forEach((n) => n.remove());
    await hideMate();
  }

  // The teammate card pops in for their moves and pops out afterwards
  // The teammate card is always vertically centred on your card, whatever their heights
  const youCenterY = () => OMG_Y + +(you.rect.dataset.h || you.rect.getAttribute("height")) / 2;
  const mateH = () => +(mate.rect.dataset.h || mate.rect.getAttribute("height"));

  // Keep it centred as it grows; move its existing rows with it
  function alignMate(skipLast) {
    const h = mateH();
    mate.y = youCenterY() - h / 2;
    mate.g.style.transition = "transform 520ms cubic-bezier(0.22, 0.8, 0.24, 1), opacity 200ms ease";
    mate.g.style.transform = `translate(${MATE_X}px, ${mate.y}px) scale(1)`;
    mate.rows.forEach((r, i) => {
      if (r.inCard || (skipLast && i === mate.rows.length - 1)) return;
      const p = rowPos(mate, i);
      r.el.style.transitionDelay = "0ms";
      place(r.el, p.x, p.y);
    });
  }

  // Shown: at its spot, full size. Hidden: tucked behind the centre of your card, smaller.
  function mateVisible(v) {
    const h = mateH();
    const s = v ? 1 : 0.6;
    const cx = v ? MATE_X + MATE_W / 2 : OMG_X + OMG_W / 2;
    const cy = youCenterY();
    mate.y = cy - h / 2;
    mate.g.style.transition = v
      ? "transform 900ms cubic-bezier(0.2, 0.9, 0.3, 1.08), opacity 200ms ease"
      : "transform 800ms cubic-bezier(0.5, 0, 0.3, 1), opacity 250ms ease 600ms";
    mate.g.style.transform = `translate(${cx - (MATE_W * s) / 2}px, ${cy - (h * s) / 2}px) scale(${s})`;
    mate.g.style.opacity = v ? 1 : 0;
    // Rows are inside the card group, so they move, scale and fade with it
  }

  async function showMate() {
    if (mate.shown) return;
    mate.shown = true;
    mate.joined = true;
    mateVisible(true);
    await sleep(mate.rows.length ? 550 : 800);
  }
  async function hideMate() {
    if (!mate.shown) return;
    mate.shown = false;
    // Any dots still flowing from the teammate card leave with it
    layers.link.querySelectorAll(".link").forEach((l) => { l.style.opacity = 0; });
    mateVisible(false);
    await sleep(300);
  }

  async function reset() {
    for (const n of layers.chip.querySelectorAll(":scope > *")) n.style.opacity = 0;
    for (const n of layers.cloud.querySelectorAll(":scope > *")) n.style.opacity = 0;
    mateVisible(false);
    await sleep(500);
    layers.chip.textContent = "";
    layers.link.textContent = "";
    mate.rows.forEach((r) => r.el.remove());
    you.rows = []; mate.rows = []; mate.shown = false; mate.joined = false;
    tweenH(you.rect, cardH(ROW_Y, 0));
    seedMate();
    for (const a of Object.values(agents)) {
      a.items = []; a.caps = {};
      a.sub.textContent = a.kind;
      tweenH(a.rect, AG_HEAD + 2);
    }
    refreshSubs();
    makeCloud();
    await sleep(600);
  }

  async function playOnce() {
    for (const [k, e] of EVENTS.entries()) {
      const o = e.who === "you" ? you : mate;
      if (e.phase) phase(e.phase);
      if (o === mate) await showMate();
      if (e.update) { await update(o, e.update); continue; }
      if (e.createOn) await createOnAgent(o, e.collect, e.createOn);
      else if (e.collect) await spawnAndCollect(o, e.collect);
      if (e.reuse) await sleep(900);
      if (o === mate) {
        await relayToYou(e.collect || e.reuse, e.send);
        await send(you, e.collect || e.reuse, e.send, "mate");
      } else {
        await send(o, e.collect || e.reuse, e.send);
      }
      // Keep the teammate on screen between back-to-back teammate moves
      if (o === mate && EVENTS[k + 1]?.who !== "mate") await hideMate();
      await sleep(150);
    }
  }

  async function run() {
    if (reduced) {
      instant = true;
      svg.classList.add("instant");
      await playOnce();
      phase("Find the best, trusted skills, keep track of personal ones, share them with your team and keep everything updated.");
      return;
    }
    for (;;) {
      await sleep(600); // let the cloud float for a moment before the first pick
      await playOnce();
      await sleep(1200);
      await reset();
    }
  }


  // Hover a skill to see every copy of it
  svg.addEventListener("pointerover", (e) => {
    const c = e.target.closest && e.target.closest(".chip");
    svg.classList.toggle("tracing", !!c);
    svg.querySelectorAll(".chip.hit").forEach((n) => n.classList.remove("hit"));
    if (c) svg.querySelectorAll(`.chip[data-skill="${c.dataset.skill}"]`).forEach((n) => n.classList.add("hit"));
  });
  svg.addEventListener("pointerleave", () => svg.classList.remove("tracing"));

  // Wait briefly for fonts so pill widths are measured with the real face
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1200))]).then(() => { build(); run(); });
})();
</script>
