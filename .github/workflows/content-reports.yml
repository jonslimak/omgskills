name: content-reports

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      publication_impact_override:
        description: Allow a reviewed publication impact that exceeds a threshold
        required: true
        default: false
        type: boolean
      publication_impact_override_reason:
        description: Required reason when the publication impact override is enabled
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  # Every workflow that commits index data or site/data must share this lock.
  group: app-data-writers
  cancel-in-progress: false

jobs:
  content-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLICATION_IMPACT_OVERRIDE: ${{ inputs.publication_impact_override == true && '1' || '' }}
      PUBLICATION_IMPACT_OVERRIDE_REASON: ${{ inputs.publication_impact_override_reason || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: index/package-lock.json

      - name: Install deps
        working-directory: index
        run: npm ci

      - name: Capture publication baseline
        working-directory: index
        run: npm run publication:impact -- snapshot --track root --output "$RUNNER_TEMP/publication-impact-root.json"

      - name: Build fresh trending snapshot
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:trending

      - name: Build content reports
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run content:reports

      - name: Build overlay data
        working-directory: index
        run: npm run content:overlays

      - name: Build homepage leaderboard data
        working-directory: index
        run: |
          npm run content:trending-leaderboard
          npm run content:author-leaderboards
          npm run content:proposed-creators
          npm run content:leaderboard-view-data

      - name: Publish hosted app data
        env:
          HEALTH_STATUS: ok
          HEALTH_MESSAGE: Latest content reports published
          HEALTH_WORKFLOW: content-reports
          HEALTH_RUN_ID: ${{ github.run_id }}
          HEALTH_GIT_SHA: ${{ github.sha }}
        run: ./scripts/publish-data.sh

      - name: Stamp content success time
        run: |
          HEALTH_STATUS=ok \
          HEALTH_MESSAGE="Latest content reports published" \
          HEALTH_LAST_CONTENT_REPORT_SUCCESS_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          HEALTH_WORKFLOW="content-reports" \
          HEALTH_RUN_ID="${{ github.run_id }}" \
          HEALTH_GIT_SHA="${{ github.sha }}" \
          node ./scripts/build-health.mjs

      - name: Verify published data
        run: node ./scripts/verify-published-data.mjs

      - name: Reset transient health snapshot
        run: |
          if git ls-files --error-unmatch site/data/health.json >/dev/null 2>&1; then
            git checkout -- site/data/health.json
          else
            rm -f site/data/health.json
          fi

      - name: Check publication impact
        working-directory: index
        run: npm run publication:impact -- check --track root --baseline "$RUNNER_TEMP/publication-impact-root.json" --json shadow/publication-impact.root.json --markdown shadow/publication-impact.root.md

      - name: Summarize publication impact
        if: always()
        run: |
          if [ -f index/shadow/publication-impact.root.md ]; then
            cat index/shadow/publication-impact.root.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publication impact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-impact-root-${{ github.run_id }}
          path: |
            index/shadow/publication-impact.root.json
            index/shadow/publication-impact.root.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit if changed
        run: |
          git config user.name "omgskills-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index/external-essentials.json index/gold-basket.json index/proposed-creators.json index/proposed-creators.md index/stats.json index/trending.json index/trending.backup.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots index/stats-report.html index/leaderboards.html index/growth-report.html index/gold-basket-review.html index/dashboard.html site/data/manifest.json site/data/trending-*.json site/data/trending-leaderboard-*.json site/data/leaderboard-view-data-*.json site/data/skill-signals-*.json site/data/author-signals-*.json site/data/author-leaderboards-*.json; then
            echo "No content report changes"
          else
            git add index/external-essentials.json index/gold-basket.json index/proposed-creators.json index/proposed-creators.md index/stats.json index/trending.json index/trending.backup.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots index/stats-report.html index/leaderboards.html index/growth-report.html index/gold-basket-review.html index/dashboard.html
            git add -A -- site/data
            git commit -m "content: update reports ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Restore latest health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./scripts/restore-health-snapshot.mjs

      - name: Prepare release assets for Netlify deploy
        run: node ./scripts/prepare-netlify-site-deploy.mjs

      - name: Install site dependencies
        run: npm ci

      - name: Build combined Netlify artifact
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build:netlify

      - name: Deploy site to Netlify
        id: production_deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: dfdb618d-b748-4c4f-a535-646dc5db449f
        run: npm run deploy:production

      - name: Upload production deploy receipt
        if: always() && steps.production_deploy.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.workflow }}-${{ github.run_id }}
          path: dist/netlify-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
