name: scrape

# Setup:
#   Create a fine-grained PAT with public-repo read access.
#   Add it as a repo secret named SCRAPER_GITHUB_TOKEN.
#   (Settings → Secrets and variables → Actions → New repository secret)
#
# Schedule: nightly at 03:00 UTC. Manual trigger available via
# Actions tab → scrape → "Run workflow".

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      publication_impact_override:
        description: Allow a reviewed publication impact that exceeds a threshold
        required: true
        default: false
        type: boolean
      publication_impact_override_reason:
        description: Required reason when the publication impact override is enabled
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: app-data-writers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PUBLICATION_IMPACT_OVERRIDE: ${{ inputs.publication_impact_override == true && '1' || '' }}
      PUBLICATION_IMPACT_OVERRIDE_REASON: ${{ inputs.publication_impact_override_reason || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: index/package-lock.json

      - name: Install deps
        working-directory: index
        run: npm ci

      - name: Validate policy inputs
        working-directory: index
        run: npm run policy:validate -- --profile scheduled-data

      - name: Capture publication baseline
        working-directory: index
        run: npm run publication:impact -- snapshot --track root --output "$RUNNER_TEMP/publication-impact-root.json"

      - name: Run scraper
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
          V2_POLICY_MODE: "observe"
        run: npm run scrape

      - name: Summarize v2 policy observation
        if: always()
        run: |
          if [ -f index/shadow/v2-policy-diff.shadow.md ]; then
            cat index/shadow/v2-policy-diff.shadow.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload v2 policy observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-policy-diff-${{ github.run_id }}
          path: |
            index/shadow/v2-policy-diff.shadow.json
            index/shadow/v2-policy-diff.shadow.md
          if-no-files-found: error
          retention-days: 14

      - name: Build trending data
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:trending

      - name: Build overlay data
        working-directory: index
        run: npm run content:overlays

      - name: Build homepage leaderboard data
        working-directory: index
        run: |
          npm run content:trending-leaderboard
          npm run content:author-leaderboards
          npm run content:leaderboard-view-data

      - name: Publish hosted app data
        env:
          HEALTH_STATUS: ok
          HEALTH_MESSAGE: Latest scrape data published
          HEALTH_WORKFLOW: scrape
          HEALTH_RUN_ID: ${{ github.run_id }}
          HEALTH_GIT_SHA: ${{ github.sha }}
        run: ./scripts/publish-data.sh

      - name: Stamp scrape success time
        run: |
          HEALTH_STATUS=ok \
          HEALTH_MESSAGE="Latest scrape data published" \
          HEALTH_LAST_SCRAPE_SUCCESS_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          HEALTH_WORKFLOW="scrape" \
          HEALTH_RUN_ID="${{ github.run_id }}" \
          HEALTH_GIT_SHA="${{ github.sha }}" \
          node ./scripts/build-health.mjs

      - name: Verify published data
        run: node ./scripts/verify-published-data.mjs

      - name: Reset transient health snapshot
        run: |
          if git ls-files --error-unmatch site/data/health.json >/dev/null 2>&1; then
            git checkout -- site/data/health.json
          else
            rm -f site/data/health.json
          fi

      - name: Check publication impact
        working-directory: index
        run: npm run publication:impact -- check --track root --baseline "$RUNNER_TEMP/publication-impact-root.json" --json shadow/publication-impact.root.json --markdown shadow/publication-impact.root.md

      - name: Summarize publication impact
        if: always()
        run: |
          if [ -f index/shadow/publication-impact.root.md ]; then
            cat index/shadow/publication-impact.root.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publication impact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-impact-root-${{ github.run_id }}
          path: |
            index/shadow/publication-impact.root.json
            index/shadow/publication-impact.root.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit if changed
        run: |
          git config user.name "omgskills-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index/skills.json index/trending.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots site/data/manifest.json site/data/skills-*.json site/data/trending-*.json site/data/trending-leaderboard-*.json site/data/leaderboard-view-data-*.json site/data/x-trending-*.json site/data/skill-signals-*.json site/data/author-signals-*.json site/data/author-leaderboards-*.json; then
            echo "No library data changes"
          else
            git add index/skills.json index/trending.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots
            git add -A -- site/data
            git commit -m "scrape: update library data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Prepare release assets for Netlify deploy
        run: node ./scripts/prepare-netlify-site-deploy.mjs

      - name: Install site dependencies
        run: npm ci

      - name: Build combined Netlify artifact
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build:netlify

      - name: Deploy site to Netlify
        id: production_deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: dfdb618d-b748-4c4f-a535-646dc5db449f
        run: npm run deploy:production

      - name: Upload production deploy receipt
        if: always() && steps.production_deploy.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.workflow }}-${{ github.run_id }}
          path: dist/netlify-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
