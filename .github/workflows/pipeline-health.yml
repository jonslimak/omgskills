name: pipeline-health

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check pipeline health
        id: healthcheck
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/check-pipeline-health.mjs || true

      - name: Check product health
        id: productcheck
        run: node ./scripts/check-product-health.mjs || true

      - name: Check marketing funnel
        id: funnelcheck
        env:
          HUMBLYTICS_API_KEY: ${{ secrets.HUMBLYTICS_API_KEY }}
          HUMBLYTICS_PROPERTY_ID: 814e1eff5ae9eb83465c64eccf151b165071a7b6fce4ac72543fbbc98c543692
          TELEMETRYDECK_TOKEN: ${{ secrets.TELEMETRYDECK_TOKEN }}
          TELEMETRYDECK_APP_ID: 9641DEC0-3FCD-47DA-872C-4325CE6A561B
          TELEMETRYDECK_DATASOURCE: com.omgskills
          FUNNEL_TIMEZONE: America/New_York
        run: node ./scripts/check-funnel-health.mjs || true

      - name: Update health snapshot
        id: finalhealth
        env:
          HEALTH_PIPELINE_STATUS: ${{ steps.healthcheck.outputs.health_status || 'degraded' }}
          HEALTH_PIPELINE_MESSAGE: ${{ steps.healthcheck.outputs.health_message || 'Pipeline health check failed' }}
          HEALTH_PIPELINE_JSON: ${{ steps.healthcheck.outputs.pipeline_health_json }}
          HEALTH_PRODUCT_JSON: ${{ steps.productcheck.outputs.product_health_json }}
          HEALTH_MARKETING_FUNNEL_JSON: ${{ steps.funnelcheck.outputs.marketing_funnel_json }}
          HEALTH_LAST_SHADOW_CRAWLER_SUCCESS_AT: ${{ steps.healthcheck.outputs.last_shadow_crawler_success_at }}
          HEALTH_PUBLISHED_AT: ${{ steps.healthcheck.outputs.last_v2_publish_at }}
          HEALTH_DEPLOYED_AT: ${{ steps.healthcheck.outputs.last_v2_deploy_at }}
          HEALTH_WORKFLOW: pipeline-health
          HEALTH_RUN_ID: ${{ github.run_id }}
          HEALTH_GIT_SHA: ${{ github.sha }}
        run: |
          HEALTH_CHECKED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          node ./scripts/build-health.mjs

      - name: Update health issue on failure
        if: steps.finalhealth.outputs.health_status == 'degraded'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pipeline health"
          BODY="Health degraded on $(date -u +"%Y-%m-%dT%H:%M:%SZ").\n\n${{ steps.finalhealth.outputs.health_message || 'Health degraded' }}"
          ISSUE_NUMBER="$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Close health issue on recovery
        if: steps.finalhealth.outputs.health_status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pipeline health"
          ISSUE_NUMBER="$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --comment "Pipeline healthy again on $(date -u +"%Y-%m-%dT%H:%M:%SZ")."
          fi

      - name: Prepare release assets for Netlify deploy
        run: node ./scripts/prepare-netlify-site-deploy.mjs

      - name: Deploy site to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: dfdb618d-b748-4c4f-a535-646dc5db449f
        run: npx netlify-cli deploy --prod --dir=site

      - name: Verify live web library pages
        run: node ./scripts/verify-web-library-pages.mjs --live

      - name: Fail on degraded health
        if: steps.finalhealth.outputs.health_status == 'degraded'
        run: exit 1
