name: workflow-writer-safety

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check-workflow-writer-locks.mjs"
      - "scripts/check-workflow-writer-locks.test.mjs"
      - "scripts/publication-impact-workflows.test.mjs"
      - "index/scripts/publication-impact.ts"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/check-workflow-writer-locks.mjs"
      - "scripts/check-workflow-writer-locks.test.mjs"
      - "scripts/publication-impact-workflows.test.mjs"
      - "index/scripts/publication-impact.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check workflow writer safety
        run: npm run test:workflow-writer-locks
