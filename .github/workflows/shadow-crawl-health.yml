name: shadow-crawl-health

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      report_only:
        description: Generate policy-precedence reports without publishing or deploying
        required: true
        default: true
        type: boolean
      creator_coverage:
        description: Run bounded creator coverage maintenance before promotion
        required: true
        default: false
        type: boolean
      publication_impact_override:
        description: Allow a reviewed publication impact that exceeds a threshold
        required: true
        default: false
        type: boolean
      publication_impact_override_reason:
        description: Required reason when the publication impact override is enabled
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: app-data-writers
  cancel-in-progress: false

jobs:
  policy-precedence-report-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.report_only == true }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: index/package-lock.json

      - name: Install deps
        working-directory: index
        run: npm ci

      - name: Validate policy inputs
        working-directory: index
        run: npm run policy:validate -- --profile scheduled-data

      - name: Build trending data
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:trending

      - name: Run report-only shadow crawl
        working-directory: index
        env:
          CRAWL4_POLICY_PRECEDENCE: "observe"
          CRAWL4_QUALITY_TIERS: "1"
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:shadow

      - name: Summarize report-only policy precedence observation
        if: always()
        run: |
          if [ -f index/shadow/policy-precedence.shadow.md ]; then
            cat index/shadow/policy-precedence.shadow.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report-only policy precedence observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-precedence-report-only-${{ github.run_id }}
          path: |
            index/shadow/policy-precedence-input.shadow.json
            index/shadow/policy-precedence.shadow.json
            index/shadow/policy-precedence.shadow.md
          if-no-files-found: error
          retention-days: 14

      - name: Run shadow guard tests
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run test:shadow-guard

  shadow-crawl-health:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.report_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Keep publish and final impact verification on the same explicit mode.
      SKILL_EQUIVALENCE_PUBLISH: "1"
      PUBLICATION_IMPACT_OVERRIDE: ${{ inputs.publication_impact_override == true && '1' || '' }}
      PUBLICATION_IMPACT_OVERRIDE_REASON: ${{ inputs.publication_impact_override_reason || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: index/package-lock.json

      - name: Install deps
        working-directory: index
        run: npm ci

      - name: Validate policy inputs
        working-directory: index
        run: npm run policy:validate -- --profile scheduled-data

      - name: Decide creator coverage maintenance
        id: creator_coverage
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MANUAL_CREATOR_COVERAGE: ${{ inputs.creator_coverage == true && '1' || '0' }}
        run: |
          enabled=false
          reason=disabled
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "0 6 * * *" ] && [ "$(date -u +%u)" = "7" ]; then
            enabled=true
            reason=weekly-sunday-0600-utc
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_CREATOR_COVERAGE" = "1" ]; then
            enabled=true
            reason=manual
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Creator coverage maintenance: $enabled ($reason)"

      - name: Capture publication baselines
        working-directory: index
        run: |
          npm run publication:impact -- snapshot --track v2 --output "$RUNNER_TEMP/publication-impact-v2.json"
          npm run publication:impact -- snapshot --track crawl4 --output "$RUNNER_TEMP/publication-impact-crawl4.json"

      - name: Build trending data
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:trending

      - name: Run shadow crawl
        working-directory: index
        env:
          CRAWL4_POLICY_PRECEDENCE: "admission"
          CRAWL4_QUALITY_TIERS: "1"
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.creator_coverage.outputs.enabled }}" = "true" ]; then
            npm run scrape:shadow -- --cadence=fast
          else
            npm run scrape:shadow
          fi

      - name: Run creator coverage maintenance
        if: ${{ steps.creator_coverage.outputs.enabled == 'true' }}
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run crawl4:creator-backfill -- --maintain --limit=125 | tee "$RUNNER_TEMP/creator-coverage.log"
          {
            echo "## Creator coverage maintenance"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/creator-coverage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload creator coverage maintenance report
        if: ${{ always() && steps.creator_coverage.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: creator-coverage-${{ github.run_id }}
          path: |
            index/shadow/creator-backfill.plan.json
            index/shadow/creator-backfill.apply.json
            ${{ runner.temp }}/creator-coverage.log
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize policy precedence observation
        if: always()
        run: |
          if [ -f index/shadow/policy-precedence.shadow.md ]; then
            cat index/shadow/policy-precedence.shadow.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload policy precedence observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-precedence-${{ github.run_id }}
          path: |
            index/shadow/policy-precedence-input.shadow.json
            index/shadow/policy-precedence.shadow.json
            index/shadow/policy-precedence.shadow.md
          if-no-files-found: warn
          retention-days: 14

      - name: Run shadow guard tests
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run test:shadow-guard

      - name: Promote cutover
        working-directory: index
        run: npm run promote:cutover

      - name: Build overlay data
        working-directory: index
        run: npm run content:overlays

      - name: Build homepage leaderboard data
        working-directory: index
        run: |
          npm run content:trending-leaderboard
          npm run content:author-leaderboards
          npm run content:leaderboard-view-data

      - name: Publish hosted v2 app data
        run: OMGSKILLS_DATA_SUBDIR=v2 ./scripts/publish-data.sh

      - name: Publish hosted Crawl 4 test data
        run: node ./scripts/publish-crawl4-data.mjs

      - name: Publish SHA history
        working-directory: index
        # Keep this after promote:cutover: canonical policy reads the current
        # suppression-filtered skills.json. Scope the rollout flag to this step
        # so unrelated publishers and Mac release commands cannot enable it.
        env:
          SHA_CANONICAL_PUBLISH: "1"
        run: npm run publish:sha-history

      - name: Publish skill equivalence
        working-directory: index
        # This runs after both data publishers so its manifest patch survives.
        run: npm run publish:skill-equivalence

      - name: Verify local published data
        env:
          OMGSKILLS_DATA_SUBDIR: v2
        run: node ./scripts/verify-published-data.mjs

      - name: Verify local Crawl 4 test data
        env:
          OMGSKILLS_DATA_SUBDIR: crawl4
        run: node ./scripts/verify-published-data.mjs

      - name: Check publication impact
        working-directory: index
        run: |
          set +e
          npm run publication:impact -- check --track v2 --baseline "$RUNNER_TEMP/publication-impact-v2.json" --json shadow/publication-impact.v2.json --markdown shadow/publication-impact.v2.md
          v2_status=$?
          npm run publication:impact -- check --track crawl4 --baseline "$RUNNER_TEMP/publication-impact-crawl4.json" --json shadow/publication-impact.crawl4.json --markdown shadow/publication-impact.crawl4.md
          crawl4_status=$?
          exit $((v2_status || crawl4_status))

      - name: Summarize publication impact
        if: always()
        run: |
          for report in index/shadow/publication-impact.v2.md index/shadow/publication-impact.crawl4.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload publication impact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-impact-app-tracks-${{ github.run_id }}
          path: |
            index/shadow/publication-impact.v2.json
            index/shadow/publication-impact.v2.md
            index/shadow/publication-impact.crawl4.json
            index/shadow/publication-impact.crawl4.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit if changed
        run: |
          git config user.name "omgskills-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index/skills.json index/trending.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots site/data/v2/manifest.json site/data/v2/skills-*.json site/data/v2/trending-*.json site/data/v2/trending-leaderboard-*.json site/data/v2/leaderboard-view-data-*.json site/data/v2/x-trending-*.json site/data/v2/skill-signals-*.json site/data/v2/author-signals-*.json site/data/v2/author-leaderboards-*.json 'site/data/v2/sha-history-*.json' 'site/data/v2/skill-equivalence-*.json' site/data/crawl4/manifest.json site/data/crawl4/skills-*.json site/data/crawl4/trending-*.json site/data/crawl4/x-trending-*.json 'site/data/crawl4/sha-history-*.json' 'site/data/crawl4/skill-equivalence-*.json'; then
            echo "No v2 or Crawl 4 library data changes"
          else
            git add index/skills.json index/trending.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots
            git add -A -- site/data/v2 site/data/crawl4
            git commit -m "shadow-crawl: publish app data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Prepare release assets for Netlify deploy
        run: node ./scripts/prepare-netlify-site-deploy.mjs

      - name: Install site dependencies
        run: npm ci

      - name: Build combined Netlify artifact
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build:netlify

      - name: Deploy site to Netlify
        id: production_deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: dfdb618d-b748-4c4f-a535-646dc5db449f
        run: npm run deploy:production

      - name: Upload production deploy receipt
        if: always() && steps.production_deploy.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ github.workflow }}-${{ github.run_id }}
          path: dist/netlify-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Advisory rerun stability check
        timeout-minutes: 20
        working-directory: index
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npx tsx scraper/new-crawl/verify-rerun-stability.ts
