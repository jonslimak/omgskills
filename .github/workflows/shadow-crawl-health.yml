name: shadow-crawl-health

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-data-writers
  cancel-in-progress: false

jobs:
  shadow-crawl-health:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync latest main
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: index/package-lock.json

      - name: Install deps
        working-directory: index
        run: npm ci

      - name: Validate policy inputs
        working-directory: index
        run: npm run policy:validate -- --profile scheduled-data

      - name: Build trending data
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:trending

      - name: Run shadow crawl
        working-directory: index
        env:
          CRAWL4_POLICY_PRECEDENCE: "observe"
          CRAWL4_QUALITY_TIERS: "1"
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run scrape:shadow

      - name: Summarize policy precedence observation
        if: always()
        run: |
          if [ -f index/shadow/policy-precedence.shadow.md ]; then
            cat index/shadow/policy-precedence.shadow.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload policy precedence observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-precedence-${{ github.run_id }}
          path: |
            index/shadow/policy-precedence.shadow.json
            index/shadow/policy-precedence.shadow.md
          if-no-files-found: warn
          retention-days: 14

      - name: Run shadow guard tests
        working-directory: index
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npm run test:shadow-guard

      - name: Promote cutover
        working-directory: index
        run: npm run promote:cutover

      - name: Build overlay data
        working-directory: index
        run: npm run content:overlays

      - name: Build homepage leaderboard data
        working-directory: index
        run: |
          npm run content:trending-leaderboard
          npm run content:author-leaderboards
          npm run content:leaderboard-view-data

      - name: Publish hosted v2 app data
        run: OMGSKILLS_DATA_SUBDIR=v2 ./scripts/publish-data.sh

      - name: Publish hosted Crawl 4 test data
        run: node ./scripts/publish-crawl4-data.mjs

      - name: Publish SHA history
        working-directory: index
        # Keep this after promote:cutover: canonical policy reads the current
        # suppression-filtered skills.json. Scope the rollout flag to this step
        # so unrelated publishers and Mac release commands cannot enable it.
        env:
          SHA_CANONICAL_PUBLISH: "1"
        run: npm run publish:sha-history

      - name: Publish skill equivalence
        working-directory: index
        # This runs after both data publishers so its manifest patch survives.
        # Scope the rollout flag to this step so unrelated publishers and Mac
        # release commands cannot enable it.
        env:
          SKILL_EQUIVALENCE_PUBLISH: "1"
        run: npm run publish:skill-equivalence

      - name: Verify local published data
        env:
          OMGSKILLS_DATA_SUBDIR: v2
        run: node ./scripts/verify-published-data.mjs

      - name: Verify local Crawl 4 test data
        env:
          OMGSKILLS_DATA_SUBDIR: crawl4
        run: node ./scripts/verify-published-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "omgskills-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index/skills.json index/trending.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots site/data/v2/manifest.json site/data/v2/skills-*.json site/data/v2/trending-*.json site/data/v2/trending-leaderboard-*.json site/data/v2/leaderboard-view-data-*.json site/data/v2/x-trending-*.json site/data/v2/skill-signals-*.json site/data/v2/author-signals-*.json site/data/v2/author-leaderboards-*.json 'site/data/v2/sha-history-*.json' 'site/data/v2/skill-equivalence-*.json' site/data/crawl4/manifest.json site/data/crawl4/skills-*.json site/data/crawl4/trending-*.json site/data/crawl4/x-trending-*.json 'site/data/crawl4/sha-history-*.json' 'site/data/crawl4/skill-equivalence-*.json'; then
            echo "No v2 or Crawl 4 library data changes"
          else
            git add index/skills.json index/trending.json index/trending-leaderboard.json index/leaderboard-view-data.json index/skill-signals.json index/author-signals.json index/author-leaderboards.json index/snapshots
            git add -A -- site/data/v2 site/data/crawl4
            git commit -m "shadow-crawl: publish app data ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Prepare release assets for Netlify deploy
        run: node ./scripts/prepare-netlify-site-deploy.mjs

      - name: Install site dependencies
        run: npm ci

      - name: Build combined Netlify artifact
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build:netlify

      - name: Deploy site to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: dfdb618d-b748-4c4f-a535-646dc5db449f
        run: npx netlify-cli deploy --prod --dir=dist/netlify-site --no-build

      - name: Verify live web library pages
        run: node ./scripts/verify-web-library-pages.mjs --live

      - name: Verify live v2 manifest
        env:
          LIVE_MANIFEST_URL: https://omgskills.com/data/v2/manifest.json
          LOCAL_MANIFEST_PATH: site/data/v2/manifest.json
        run: node ./scripts/verify-live-manifest.mjs

      - name: Verify live Crawl 4 manifest
        env:
          LIVE_MANIFEST_URL: https://omgskills.com/data/crawl4/manifest.json
          LOCAL_MANIFEST_PATH: site/data/crawl4/manifest.json
        run: node ./scripts/verify-live-manifest.mjs

      - name: Advisory rerun stability check
        timeout-minutes: 20
        working-directory: index
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPER_GITHUB_TOKEN }}
        run: npx tsx scraper/new-crawl/verify-rerun-stability.ts
