<html lang="en">
<head>
<meta charset="utf-8">

<title>omgskills — hero mock dev (pass 2)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  :root {
    --exp: cubic-bezier(.16, 1, .3, 1);
    --pop: cubic-bezier(.34, 1.56, .64, 1);
    --blue: #0a7aff;
    --ink: #1d1d1f;
    --gray: rgba(0,0,0,.45);
    --faint: rgba(0,0,0,.28);
    --desc: #86868b;
    --line: rgba(0,0,0,.08);
  }
  svg.lucide { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }

  .stage { display: flex; flex-direction: column; align-items: flex-end; width: 820px; }

  /* ── menu bar ── */
  .menubar {
    width: 560px; height: 30px;
    background: rgba(28,28,30,.72); backdrop-filter: blur(20px);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 2px; padding: 0 10px;
    animation: .55s var(--exp) both mb-in;
  }
  .mb { color: rgba(255,255,255,.78); font-size: 12px; padding: 3px 7px; border-radius: 5px; line-height: 1; }
  .mb.owl { transition: background .18s; }
  .stage.open .mb.owl { background: rgba(255,255,255,.24); }
  .mb.clock { font-size: 11.5px; letter-spacing: .01em; }
  @keyframes mb-in { from { opacity: 0; transform: translateY(-8px); } }

  /* ── popover shell ── */
  .pop-anchor { position: relative; margin-top: 9px; width: 820px; display: flex; justify-content: flex-end; }
  .pop-arrow {
    position: absolute; top: -5px; right: 118px; z-index: 2;
    width: 14px; height: 14px; transform: rotate(45deg);
    background: #fbfbfb; border-radius: 3px; opacity: 0;
  }
  .stage.open .pop-arrow { animation: .3s var(--exp) .12s both fade; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .popover {
    width: 420px; height: 640px;
    background: #fbfbfb;
    border-radius: 14px;
    box-shadow: 0 22px 70px rgba(0,0,0,.55), 0 2px 12px rgba(0,0,0,.35);
    overflow: hidden;
    opacity: 0;
    transform-origin: top right;
    transition: width .55s var(--exp);
    display: flex; flex-direction: column;
  }
  .stage.open .popover { animation: .5s var(--pop) both pop-in; }
  .stage.detail .popover { width: 820px; }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(.96) translateY(-8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ── top controls: star left, person/globe right ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .fav { font-size: 15px; color: var(--faint); }
  .mode { display: flex; gap: 6px; }
  .mode span {
    font-size: 13px; color: var(--faint);
    width: 30px; height: 24px; border-radius: 7px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
  }
  .mode span.active { background: rgba(0,0,0,.08); color: var(--ink); }

  /* ── search field ── */
  .search {
    display: flex; align-items: center;
    padding: 10px 16px 12px; border-bottom: 1px solid var(--line);
  }
  .search-line { flex: 1; position: relative; display: flex; align-items: center; font-size: 15px; color: var(--ink); }
  .placeholder { position: absolute; color: rgba(0,0,0,.28); transition: opacity .15s; }
  .stage.hasquery .placeholder { opacity: 0; }
  .qtext { white-space: pre; }
  .caret { width: 1.5px; height: 18px; margin-left: 1px; background: var(--blue); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .clear { font-size: 13px; color: var(--faint); opacity: 0; transition: opacity .2s; }
  .stage.hasquery .clear { opacity: 1; }

  /* ── body: columns ── */
  .cols { flex: 1; display: flex; min-height: 0; }
  .listcol { width: 420px; flex: none; overflow: hidden; padding: 6px 0; }

  /* categories (empty state) */
  .cats { padding: 10px 24px; column-count: 2; column-gap: 28px; }
  .cats.hide { display: none; }
  .cat-section { break-inside: avoid; margin-bottom: 18px; }
  .cat-h { font-size: 12px; font-weight: 600; color: rgba(0,0,0,.32); margin: 0 0 6px 2px; }
  .cat {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--ink); padding: 7px 2px;
  }
  .cat .lucide { font-size: 13px; color: var(--gray); }
  .cat .chev { margin-left: auto; font-size: 10px; color: rgba(0,0,0,.2); }
  .stage.results .cats { display: none; }

  /* result rows */
  .rows { display: none; padding: 2px 8px; }
  .stage.results .rows { display: block; }
  .row { padding: 9px 12px; border-radius: 9px; opacity: 0; }
  .stage.results .row { animation: .45s var(--exp) both row-in; }
  .stage.results .row:nth-child(1) { animation-delay: .04s; }
  .stage.results .row:nth-child(2) { animation-delay: .1s; }
  .stage.results .row:nth-child(3) { animation-delay: .16s; }
  .stage.results .row:nth-child(4) { animation-delay: .22s; }
  .stage.results .row:nth-child(5) { animation-delay: .28s; }
  .stage.results .row:nth-child(6) { animation-delay: .34s; }
  @keyframes row-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .row-top { display: flex; align-items: baseline; gap: 7px; }
  .rname { font-size: 14px; font-weight: 700; color: var(--ink); }
  .rauthor { font-size: 12px; color: rgba(0,0,0,.35); }
  .rstars { margin-left: auto; font-size: 12px; color: var(--gray); display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
  .rdesc { margin-top: 2px; font-size: 12px; line-height: 1.4; color: var(--desc); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row.selected { background: var(--blue); }
  .row.selected .rname, .row.selected .rstars { color: #fff; }
  .row.selected .rauthor { color: rgba(255,255,255,.75); }
  .row.selected .rdesc { color: rgba(255,255,255,.85); }

  /* ── detail panel ── */
  .detailcol {
    flex: 1; min-width: 0; border-left: 1px solid var(--line);
    padding: 22px 26px; overflow: hidden;
    opacity: 0; transform: translateX(14px);
  }
  .stage.detail .detailcol { animation: .5s var(--exp) .18s both slide-in; }
  @keyframes slide-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .dtitle { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .dmeta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--gray); }
  .avatar { width: 20px; height: 20px; border-radius: 50%; background: #d8d8dc center/cover; }
  .dactions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 9px;
  }
  .btn .lucide { font-size: 13px; }
  .btn.claude { background: var(--blue); color: #fff; }
  .btn.claude.installing { opacity: .75; }
  .btn.claude.done { background: rgba(0,0,0,.07); color: var(--ink); }
  .btn.codex { background: rgba(0,0,0,.07); color: var(--ink); }
  .btn.plain { background: none; color: var(--ink); padding: 7px 6px; font-weight: 600; }
  .btn.pressing { animation: .3s var(--pop) press; }
  @keyframes press { 50% { transform: scale(.93); } }
  .dquote {
    margin-top: 18px; padding: 16px 18px;
    background: rgba(0,0,0,.045); border-radius: 12px;
    font-family: "New York", Georgia, "Times New Roman", serif;
    font-style: italic; font-size: 15px; line-height: 1.5; color: #3a3a3c;
  }
  .dreadme { margin-top: 20px; font-family: "New York", Georgia, serif; font-size: 13.5px; line-height: 1.6; color: #3a3a3c; }
  .dreadme h3 { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .dreadme blockquote { border-left: 3px solid rgba(0,0,0,.15); padding-left: 12px; color: rgba(0,0,0,.55); margin: 8px 0; }
  .dreadme a { color: var(--blue); text-decoration: none; }

  /* ── device view (person mode) ── */
  .device { display: none; flex: 1; flex-direction: column; padding: 4px 0; }
  .stage.deviceview .device { display: flex; }
  .stage.deviceview .cols { display: none; }
  .tabs { display: flex; justify-content: center; gap: 0; padding: 10px 16px 12px; }
  .tabitem { font-size: 13px; color: var(--gray); padding: 0 20px; border-left: 1px solid var(--line); }
  .tabitem:first-child { border-left: none; }
  .tabitem b { color: var(--ink); font-weight: 700; margin-left: 5px; }
  .tabitem.on { color: var(--ink); }
  .dev-h { font-size: 12px; font-weight: 600; color: rgba(0,0,0,.3); padding: 8px 26px 4px; }
  .dev-rows { padding: 0 10px; }
  .drow {
    display: flex; align-items: center;
    padding: 9px 16px; border-radius: 9px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    opacity: 0;
  }
  .stage.deviceview .drow { animation: .4s var(--exp) both row-in; }
  .stage.deviceview .drow:nth-child(1) { animation-delay: .05s; }
  .stage.deviceview .drow:nth-child(2) { animation-delay: .1s; }
  .stage.deviceview .drow:nth-child(3) { animation-delay: .15s; }
  .stage.deviceview .drow:nth-child(4) { animation-delay: .2s; }
  .stage.deviceview .drow:nth-child(5) { animation-delay: .25s; }
  .drow .harness { margin-left: auto; font-weight: 600; font-size: 12px; color: var(--gray); }
  .drow .age { width: 44px; text-align: right; font-weight: 400; font-size: 12px; color: rgba(0,0,0,.3); }
  .drow.fresh { background: rgba(10,122,255,.08); }
  .drow.fresh .age { color: var(--blue); font-weight: 600; }
  .dev-foot { margin-top: auto; padding: 12px 26px 16px; }
  .dev-foot .fh { font-size: 12px; font-weight: 600; color: rgba(0,0,0,.3); margin-bottom: 6px; }
  .dev-foot .field {
    border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 12px; font-size: 13px; color: rgba(0,0,0,.28);
    background: #fff;
  }

  .hud { position: fixed; bottom: 12px; left: 14px; color: rgba(255,255,255,.35); font-size: 11px; font-family: ui-monospace, monospace; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .popover, .pop-arrow, .row, .detailcol, .drow { opacity: 1 !important; }
  }
</style>

      ["impeccable", "@pbakaus", "47k", "Design taste for AI harnesses — spacing, hierarchy, and restraint that make interfaces feel right."],
      ["emil-design-eng", "@emilkowalski", "14.2k", "Skills for design engineers: motion, micro-interaction, and component craft."],
      ["canvas-design", "@anthropics", "129k", "Guidelines for visual design work on canvas artifacts — layout, color, typography."],
      ["design-system", "@affaan-m", "230k", "Design-system patterns: tokens, primitives, and component API conventions."],
      ["taste-skill", "@leonxlnx", "64.1k", "Anti-slop design taste — image-to-code with opinionated aesthetics."],
    ],
    detail: {
      name: "frontend-design", author: "@anthropics", stars: "161k", updated: "Updated 1w ago",
      avatar: "https://github.com/anthropics.png?size=64",
      quote: "Create distinctive, production-grade frontend interfaces with high design quality.",
      readmeTitle: "Frontend Design",
      readme: 'Anthropic&rsquo;s official skill for building web interfaces that avoid generic AI aesthetics — typography, color, spacing, and motion guidance distilled from production work.',
    },
    installedRow: ["frontend-design", "Claude", "now"],
  },
];

const DEVICE_BASE = [
  ["swiftui-performance-audit", "Codex", "10d"],
  ["pp-espn", "Claude", "20d"],
  ["printing-press", "Codex", "20d"],
  ["zoom-out", "Codex", "24d"],
];

const stage = document.getElementById("stage");
const qtext = document.getElementById("qtext");
const rowsEl = document.getElementById("rows");
const detailEl = document.getElementById("detail");
const devrowsEl = document.getElementById("devrows");
const hud = document.getElementById("hud");
const modeUser = document.getElementById("mode-user");
const modeGlobe = document.getElementById("mode-globe");
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const ph = (p) => { hud.textContent = "phase: " + p; };

function renderRows(rows) {
  rowsEl.innerHTML = rows.map(([name, author, stars, desc]) => `
    <div class="row">
      <div class="row-top">
        <span class="rname">${name}</span>
        <span class="rauthor">${author}</span>
        <span class="rstars"><svg class="lucide" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><use href="#i-star"/></svg>${stars}</span>
      </div>
      <div class="rdesc">${desc}</div>
    </div>`).join("");
}

function renderDetail(d) {
  detailEl.innerHTML = `
    <div class="dtitle">${d.name}</div>
    <div class="dmeta">
      <span class="avatar" style="background-image:url('${d.avatar}')"></span>
      <span>${d.author}</span><span>&middot;</span>
      <span><svg class="lucide" viewBox="0 0 24 24"><use href="#i-star"/></svg> ${d.stars}</span><span>&middot;</span>
      <span>${d.updated}</span>
    </div>
    <div class="dactions">
      <span class="btn claude" id="btn-claude"><svg class="lucide" viewBox="0 0 24 24"><use href="#i-down"/></svg>Claude</span>
      <span class="btn codex"><svg class="lucide" viewBox="0 0 24 24"><use href="#i-down"/></svg>Codex</span>
      <span class="btn plain"><svg class="lucide" viewBox="0 0 24 24"><use href="#i-up"/></svg>GitHub</span>
      <span class="btn plain"><svg class="lucide" viewBox="0 0 24 24"><use href="#i-share"/></svg>Share</span>
    </div>
    <div class="dquote">${d.quote}</div>
    <div class="dreadme"><h3>${d.readmeTitle}</h3><p>${d.readme}</p></div>`;
}

function renderDevice(freshRow) {
  const all = [freshRow, ...DEVICE_BASE];
  devrowsEl.innerHTML = all.map(([name, harness, age], i) => `
    <div class="drow${i === 0 ? " fresh" : ""}">
      <span>${name}</span>
      <span class="harness">${harness}</span>
      <span class="age">${age}</span>
    </div>`).join("");
}

async function typeQuery(q) {
  stage.classList.add("hasquery");
  for (const ch of q) {
    qtext.textContent += ch;
    await wait(90 + Math.random() * 50);
  }
}

async function eraseQuery() {
  while (qtext.textContent.length) {
    qtext.textContent = qtext.textContent.slice(0, -1);
    await wait(28);
  }
  stage.classList.remove("hasquery");
}

async function runScenario(s) {
  ph("type: " + s.q);
  await typeQuery(s.q);
  await wait(180);

  ph("results");
  renderRows(s.rows);
  stage.classList.add("results");
  await wait(850);

  ph("navigate");
  const rows = [...rowsEl.querySelectorAll(".row")];
  for (let i = 0; i <= s.selectIndex; i++) {
    rows.forEach(r => r.classList.remove("selected"));
    rows[i].classList.add("selected");
    await wait(i === s.selectIndex ? 500 : 260);
  }

  ph("detail");
  renderDetail(s.detail);
  stage.classList.add("detail");
  await wait(1500);

  ph("install");
  const btn = document.getElementById("btn-claude");
  btn.classList.add("pressing", "installing");
  btn.innerHTML = '<svg class="lucide" viewBox="0 0 24 24"><use href="#i-down"/></svg>Installing&hellip;';
  await wait(900);
  btn.classList.remove("pressing", "installing");
  btn.classList.add("done");
  btn.innerHTML = '<svg class="lucide" viewBox="0 0 24 24"><use href="#i-check"/></svg>Claude';
  await wait(1200);

  ph("device view");
  modeGlobe.classList.remove("active");
  modeUser.classList.add("active");
  document.getElementById("ph").textContent = "Search your device...";
  stage.classList.remove("detail");
  renderDevice(s.installedRow);
  await wait(320);
  stage.classList.add("deviceview");
  qtext.textContent = ""; stage.classList.remove("hasquery");
  await wait(2400);

  ph("reset");
  stage.classList.remove("deviceview", "results");
  rowsEl.innerHTML = ""; detailEl.innerHTML = "";
  modeUser.classList.remove("active");
  modeGlobe.classList.add("active");
  document.getElementById("ph").textContent = "Search for skills on Github...";
  await wait(900);
}

async function loop() {
  await wait(500);
  ph("open");
  stage.classList.add("open");
  await wait(1400);
  let i = 0;
  for (;;) {
    await runScenario(SCENARIOS[i % SCENARIOS.length]);
    i++;
  }
}
loop();

// scale stage to fit viewport width
function fit() {
  const w = document.documentElement.clientWidth;
  const scale = Math.min(1, (w - 40) / 840);
  stage.style.transform = `scale(${scale})`;
  stage.style.transformOrigin = "top center";
}
addEventListener("resize", fit); fit();
</script>
</body>
</html>
