<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omgskills — hero mock dev (pass 3)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #fff;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  :root {
    --exp: cubic-bezier(.16, 1, .3, 1);
    --pop: cubic-bezier(.34, 1.56, .64, 1);
    --blue: #0a7aff;
    --ink: #1d1d1f;
    --gray: rgba(0,0,0,.45);
    --faint: rgba(0,0,0,.28);
    --desc: #86868b;
    --line: rgba(0,0,0,.08);
  }
  svg.lucide { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }

  .stage { display: flex; flex-direction: column; align-items: flex-end; width: 820px; }

  /* ── menu bar ── */
  .menubar {
    width: 560px; height: 30px;
    background: transparent;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 2px; padding: 0 10px;
    animation: .55s var(--exp) both mb-in;
  }
  .mb { color: rgba(0,0,0,.75); font-size: 12px; padding: 3px 7px; border-radius: 5px; line-height: 1; }
  .mb.owl { transition: background .18s; }
  .stage.open .mb.owl { background: rgba(0,0,0,.14); }
  .mb.clock { font-size: 11.5px; letter-spacing: .01em; }
  @keyframes mb-in { from { opacity: 0; transform: translateY(-8px); } }

  /* ── popover shell ── */
  .pop-anchor { position: relative; margin-top: 9px; width: 820px; display: flex; justify-content: flex-end; }
  .pop-arrow {
    position: absolute; top: -5px; z-index: 2;
    width: 14px; height: 14px; transform: rotate(45deg);
    background: #fbfbfb; border-radius: 3px; opacity: 0;
    right: 118px; /* JS re-anchors under the owl icon */
  }
  .stage.open .pop-arrow { animation: .3s var(--exp) .12s both fade; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .popover {
    width: 400px; height: 856px;
    background: #fbfbfb;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.18), 0 2px 10px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
    overflow: hidden;
    opacity: 0;
    transform-origin: top right;
    transition: width .55s var(--exp);
    display: flex; flex-direction: column;
  }
  .stage.open .popover { animation: .5s var(--pop) both pop-in; }
  .stage.detail .popover { width: 750px; }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(.96) translateY(-8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ── top controls ── */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .fav { font-size: 13px; color: var(--faint); }
  .mode { display: flex; gap: 6px; }
  .mode span {
    font-size: 12px; color: var(--faint);
    width: 28px; height: 22px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
  }
  .mode span.active { background: rgba(0,0,0,.08); color: var(--ink); }

  /* ── search field ── */
  .search {
    display: flex; align-items: center;
    padding: 10px 16px 12px; border-bottom: 1px solid var(--line);
  }
  .search-line { flex: 1; position: relative; display: flex; align-items: center; font-size: 12px; color: var(--ink); }
  .placeholder { position: absolute; color: rgba(0,0,0,.28); transition: opacity .15s; }
  .stage.hasquery .placeholder { opacity: 0; }
  .qtext { white-space: pre; }
  .caret { width: 1.5px; height: 15px; margin-left: 1px; background: var(--blue); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .clear { font-size: 13px; color: var(--faint); opacity: 0; transition: opacity .2s; }
  .stage.hasquery .clear { opacity: 1; }

  /* ── body: columns ── */
  .cols { flex: 1; display: flex; min-height: 0; }
  .listcol { width: 400px; flex: none; overflow: hidden; padding: 4px 0 0; display: flex; flex-direction: column; transition: width .55s var(--exp); }
  .stage.detail .listcol { width: 320px; }

  /* categories (discover / empty state) */
  .cats { flex: 1; padding: 20px 34px 10px; display: flex; flex-direction: column; }
  .cat-section { margin-bottom: 19px; }
  .cat-h { font-size: 11.5px; font-weight: 500; color: rgba(0,0,0,.32); margin: 0 0 7px 2px; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 34px; }
  .cat {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--ink); padding: 8px 2px;
  }
  .cat .lucide { font-size: 11.5px; color: rgba(0,0,0,.55); flex: none; }
  .cat .chev { margin-left: auto; font-size: 10px; color: rgba(0,0,0,.2); }
  .cat-send { margin-top: auto; padding: 8px 2px 14px; font-size: 12px; color: rgba(0,0,0,.35); display: flex; align-items: center; gap: 10px; }
  .stage.results .cats { display: none; }

  /* result rows */
  .rows { display: none; padding: 2px 8px; }
  .stage.results .rows { display: block; }
  .row { padding: 8px 12px; border-radius: 9px; opacity: 0; }
  .stage.results .row { animation: .45s var(--exp) both row-in; }
  .stage.results .row:nth-child(1)  { animation-delay: .04s; }
  .stage.results .row:nth-child(2)  { animation-delay: .09s; }
  .stage.results .row:nth-child(3)  { animation-delay: .14s; }
  .stage.results .row:nth-child(4)  { animation-delay: .19s; }
  .stage.results .row:nth-child(5)  { animation-delay: .24s; }
  .stage.results .row:nth-child(6)  { animation-delay: .29s; }
  .stage.results .row:nth-child(7)  { animation-delay: .34s; }
  .stage.results .row:nth-child(8)  { animation-delay: .39s; }
  .stage.results .row:nth-child(9)  { animation-delay: .44s; }
  .stage.results .row:nth-child(10) { animation-delay: .49s; }
  .stage.results .row:nth-child(11) { animation-delay: .54s; }
  .stage.results .row:nth-child(12) { animation-delay: .59s; }
  .stage.results .row:nth-child(13) { animation-delay: .64s; }
  @keyframes row-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .row-top { display: flex; align-items: baseline; gap: 7px; }
  .rname { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rauthor { font-size: 11px; color: rgba(0,0,0,.35); white-space: nowrap; }
  /* fixed-width, leading-aligned metric column (matches SwiftUI frame(width:60, .leading)) */
  .rstars {
    margin-left: auto; flex: none; width: 62px;
    font-size: 11px; color: var(--gray);
    display: flex; gap: 4px; align-items: center; justify-content: flex-start;
    font-variant-numeric: tabular-nums;
  }
  .rdesc { margin-top: 1px; font-size: 10.5px; line-height: 1.4; color: var(--desc); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row.selected { background: var(--blue); }
  .row.selected .rname, .row.selected .rstars { color: #fff; }
  .row.selected .rauthor { color: rgba(255,255,255,.75); }
  .row.selected .rdesc { color: rgba(255,255,255,.85); }

  /* ── detail panel ── */
  .detailcol {
    flex: 1; min-width: 0; border-left: 1px solid var(--line);
    padding: 22px 26px 0; overflow: hidden;
    opacity: 0; transform: translateX(14px);
    display: flex; flex-direction: column;
  }
  .stage.detail .detailcol { animation: .5s var(--exp) .18s both slide-in; }
  @keyframes slide-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .dtitle { font-size: 29px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .dmeta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--gray); }
  .avatar { width: 20px; height: 20px; border-radius: 50%; background: #d8d8dc center/cover; }
  .dactions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 9px;
  }
  .btn .lucide { font-size: 13px; }
  .btn.claude { background: var(--blue); color: #fff; }
  .btn.claude.installing { opacity: .75; }
  .btn.claude.done { background: rgba(0,0,0,.07); color: var(--ink); }
  .btn.codex { background: var(--blue); color: #fff; }
  .btn.plain { background: none; color: var(--ink); padding: 7px 6px; font-weight: 600; }
  .btn.pressing { animation: .3s var(--pop) press; }
  @keyframes press { 50% { transform: scale(.93); } }
  .dquote {
    margin-top: 18px; padding: 15px 18px;
    background: rgba(0,0,0,.045); border-radius: 12px;
    font-family: "New York", Georgia, "Times New Roman", serif;
    font-style: italic; font-size: 14.5px; line-height: 1.5; color: #3a3a3c;
  }
  .dreadme { margin-top: 18px; flex: 1; overflow: hidden; font-family: "New York", Georgia, serif; font-size: 13px; line-height: 1.62; color: #3a3a3c;
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
  .dreadme h3 { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .dreadme p { margin-bottom: 10px; }
  .dreadme blockquote { border-left: 3px solid rgba(0,0,0,.15); padding-left: 12px; color: rgba(0,0,0,.55); margin: 10px 0; font-style: italic; }
  .dreadme a { color: var(--blue); text-decoration: none; }
  .dreadme b { font-weight: 700; }

  /* ── device view ── */
  .device { display: none; flex: 1; flex-direction: column; padding: 4px 0 0; min-height: 0; }
  .stage.deviceview .device { display: flex; }
  .stage.deviceview .cols { display: none; }
  .tabs { display: flex; justify-content: center; padding: 10px 16px 12px; }
  .tabitem { font-size: 11.5px; color: var(--gray); padding: 0 18px; border-left: 1px solid var(--line); }
  .tabitem:first-child { border-left: none; }
  .tabitem b { color: var(--ink); font-weight: 700; margin-left: 5px; }
  .dev-h { font-size: 10.5px; font-weight: 500; color: rgba(0,0,0,.3); padding: 8px 26px 4px; }
  .dev-rows { padding: 0 10px; }
  .drow {
    display: flex; align-items: center;
    padding: 7px 16px; border-radius: 8px;
    font-size: 12px; font-weight: 600; color: var(--ink);
    opacity: 0;
  }
  .stage.deviceview .drow { animation: .4s var(--exp) both row-in; }
  .stage.deviceview .drow:nth-child(1)  { animation-delay: .05s; }
  .stage.deviceview .drow:nth-child(2)  { animation-delay: .09s; }
  .stage.deviceview .drow:nth-child(3)  { animation-delay: .13s; }
  .stage.deviceview .drow:nth-child(4)  { animation-delay: .17s; }
  .stage.deviceview .drow:nth-child(5)  { animation-delay: .21s; }
  .stage.deviceview .drow:nth-child(6)  { animation-delay: .25s; }
  .stage.deviceview .drow:nth-child(7)  { animation-delay: .29s; }
  .stage.deviceview .drow:nth-child(8)  { animation-delay: .33s; }
  .stage.deviceview .drow:nth-child(9)  { animation-delay: .37s; }
  .stage.deviceview .drow:nth-child(10) { animation-delay: .41s; }
  .drow .harness { margin-left: auto; font-weight: 600; font-size: 10px; color: var(--gray); }
  .drow .age { width: 42px; text-align: right; font-weight: 400; font-size: 10px; color: rgba(0,0,0,.3); }
  .drow.fresh { background: rgba(10,122,255,.08); }
  .drow.fresh .age { color: var(--blue); font-weight: 600; }
  .dev-foot { margin-top: auto; padding: 12px 26px 16px; }
  .dev-foot .fh { font-size: 10.5px; font-weight: 500; color: rgba(0,0,0,.3); margin-bottom: 6px; }
  .dev-foot .field {
    border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 11px; font-size: 11.5px; color: rgba(0,0,0,.28);
    background: #fff;
  }


  /* ── creators list view ── */
  .creators { display: none; flex: 1; padding: 14px 24px 0; }
  .stage.creatorsview .creators { display: block; }
  .stage.creatorsview .cats { display: none; }
  .cre-h { font-size: 11.5px; font-weight: 500; color: rgba(0,0,0,.3); margin: 2px 0 10px 2px; }
  .cre-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .ccell { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-radius: 8px; opacity: 0; }
  .stage.creatorsview .ccell { animation: .4s var(--exp) both row-in; }
  .ccell img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; background: #e8e8ea; flex: none; }
  .ccell .cmeta { min-width: 0; }
  .ccell .cname { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ccell .csub { font-size: 10px; color: var(--desc); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ccell .chev { margin-left: auto; font-size: 9px; color: rgba(0,0,0,.2); flex: none; }
  .ccell.selected { background: rgba(10,122,255,.12); }
  .cat.tapped { background: rgba(10,122,255,.1); border-radius: 7px; }

  /* ── creator profile view ── */
  .profile { display: none; flex: 1; min-height: 0; flex-direction: column; padding: 16px 20px 0; overflow: hidden; }
  .stage.profileview .profile { display: flex; }
  .stage.profileview .cats, .stage.profileview .creators, .stage.profileview .rows { display: none; }
  .p-head { display: flex; gap: 13px; align-items: center; }
  .p-avatar { width: 62px; height: 62px; border-radius: 14px; object-fit: cover; background: #e8e8ea; flex: none; transition: width .4s var(--exp), height .4s var(--exp); }
  .stage.detail .p-avatar { width: 44px; height: 44px; border-radius: 10px; }
  .p-name { font-size: 25px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .stage.detail .p-name { font-size: 19px; }
  .p-sub { font-size: 11.5px; color: var(--desc); margin-top: 2px; }
  .p-bio { font-size: 12px; margin-top: 11px; color: var(--ink); line-height: 1.45; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .p-featured { display: flex; justify-content: space-between; margin: 10px 4px 4px; font-size: 10.5px; }
  .p-featured .lab { color: rgba(0,0,0,.3); font-weight: 500; }
  .p-featured .see { color: var(--blue); }
  .prows { margin: 0 -8px; }
  .stage.profileview .prows .row { animation: .4s var(--exp) both row-in; }

  /* readme extras: code + lists */
  .dreadme code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; background: rgba(0,0,0,.055); padding: 1px 5px; border-radius: 5px; font-style: normal; }
  .dreadme pre { background: rgba(0,0,0,.045); border-radius: 10px; padding: 11px 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin: 9px 0; overflow: hidden; }
  .dreadme ol { padding-left: 18px; margin: 6px 0; }
  .dreadme li { margin-bottom: 6px; }
  .dreadme h3 + p { margin-top: 0; }

  .hud { position: fixed; bottom: 12px; left: 14px; color: rgba(0,0,0,.3); font-size: 11px; font-family: ui-monospace, monospace; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .popover, .pop-arrow, .row, .detailcol, .drow { opacity: 1 !important; }
  }
</style>
</head>

      <div class="ccell" data-handle="${h}" style="animation-delay:${(i * 0.03).toFixed(2)}s">
        <img src="https://github.com/${h}.png?size=64" alt="">
        <span class="cmeta"><span class="cname">${name}</span><span class="csub">${sub}</span></span>
        <span class="chev">${icon("i-chev")}</span>
      </div>`).join("") + '</div>';
}

function renderProfile(c) {
  document.getElementById("profile").innerHTML = `
    <div class="p-head">
      <img class="p-avatar" src="https://github.com/${c.handle}.png?size=128" alt="">
      <div><div class="p-name">${c.name}</div><div class="p-sub">${c.sub}</div></div>
    </div>
    <div class="p-bio">${c.bio}</div>
    <div class="p-featured"><span class="lab">Featured</span><span class="see">See all</span></div>
    <div class="prows">${c.skills.map(([name, stars, desc], i) => `
      <div class="row" style="animation-delay:${(i * 0.05).toFixed(2)}s">
        <div class="row-top">
          <span class="rname">${name}</span>
          <span class="rstars">${icon("i-star", ' style="fill:currentColor;stroke:none"')}${stars}</span>
        </div>
        <div class="rdesc">${desc}</div>
      </div>`).join("")}</div>`;
}

async function runCreatorScenario() {
  ph("discover");
  await wait(1500);

  ph("tap creators");
  const creatorsCat = catsEl.querySelector(".cat");
  creatorsCat.classList.add("tapped");
  await wait(450);
  creatorsCat.classList.remove("tapped");

  ph("creators list");
  document.querySelector(".fav").innerHTML = icon("i-back");
  renderCreators();
  stage.classList.add("creatorsview");
  await wait(2100);

  ph("select matt");
  const mattCell = document.querySelector('.ccell[data-handle="mattpocock"]');
  mattCell.classList.add("selected");
  mattCell.scrollIntoView({ block: "nearest" });
  await wait(700);

  ph("profile");
  stage.classList.remove("creatorsview");
  renderProfile(MATT);
  stage.classList.add("profileview");
  await wait(2100);

  ph("select skill");
  const first = document.querySelector("#profile .prows .row");
  first.classList.add("selected");
  await wait(600);

  ph("detail");
  renderDetail(MATT.detail);
  stage.classList.add("detail");
  await wait(2400);

  ph("install");
  const btn = document.getElementById("btn-claude");
  btn.classList.add("pressing", "installing");
  btn.innerHTML = icon("i-down") + "Installing&hellip;";
  await wait(900);
  btn.classList.remove("pressing", "installing");
  btn.classList.add("done");
  btn.innerHTML = icon("i-check") + "Claude";
  await wait(1600);

  ph("reset");
  stage.classList.remove("profileview", "detail");
  document.getElementById("profile").innerHTML = "";
  detailEl.innerHTML = "";
  document.querySelector(".fav").innerHTML = icon("i-star");
  await wait(400);
}

/* arrow: center under the owl icon */
function anchorArrow() {
  const owl = document.getElementById("owl").getBoundingClientRect();
  const anchor = document.getElementById("anchor").getBoundingClientRect();
  const scale = anchor.width / 820; /* account for stage scale */
  const rightPx = (anchor.right - (owl.left + owl.width / 2)) / scale - 7;
  document.getElementById("arrow").style.right = rightPx + "px";
}

function fit() {
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;
  const scale = Math.min(1, (w - 40) / 840, (h - 48) / 900);
  stage.style.transform = `scale(${scale})`;
  stage.style.transformOrigin = "top center";
  requestAnimationFrame(anchorArrow);
}
addEventListener("resize", fit);

/* ── phases ───────────────────────────────────────────────── */
async function typeQuery(q) {
  stage.classList.add("hasquery");
  for (const ch of q) {
    qtext.textContent += ch;
    await wait(90 + Math.random() * 50);
  }
}

async function runScenario(s) {
  ph("discover");
  await wait(1600);

  ph("type: " + s.q);
  await typeQuery(s.q);
  await wait(180);

  ph("results");
  renderRows(s.rows);
  stage.classList.add("results");
  await wait(950);

  ph("navigate");
  const rows = [...rowsEl.querySelectorAll(".row")];
  for (let i = 0; i <= s.selectIndex; i++) {
    rows.forEach(r => r.classList.remove("selected"));
    rows[i].classList.add("selected");
    await wait(i === s.selectIndex ? 500 : 260);
  }

  ph("detail");
  renderDetail(s.detail);
  stage.classList.add("detail");
  await wait(1600);

  ph("install");
  const btn = document.getElementById("btn-claude");
  btn.classList.add("pressing", "installing");
  btn.innerHTML = icon("i-down") + "Installing&hellip;";
  await wait(900);
  btn.classList.remove("pressing", "installing");
  btn.classList.add("done");
  btn.innerHTML = icon("i-check") + "Claude";
  await wait(1200);

  ph("device view");
  modeGlobe.classList.remove("active");
  modeUser.classList.add("active");
  document.getElementById("ph").textContent = "Search your device...";
  stage.classList.remove("detail");
  renderDevice(s.installedRow);
  await wait(320);
  stage.classList.add("deviceview");
  qtext.textContent = ""; stage.classList.remove("hasquery");
  await wait(2400);

  ph("reset");
  stage.classList.remove("deviceview", "results");
  rowsEl.innerHTML = ""; detailEl.innerHTML = "";
  modeUser.classList.remove("active");
  modeGlobe.classList.add("active");
  document.getElementById("ph").textContent = "Search for skills on Github...";
  await wait(400);
}

async function loop() {
  renderCats();
  fit();
  await wait(500);
  ph("open");
  stage.classList.add("open");
  requestAnimationFrame(anchorArrow);
  const flows = [() => runScenario(SCENARIOS[0]), () => runScenario(SCENARIOS[1]), runCreatorScenario];
  let i = 0;
  for (;;) {
    await flows[i % flows.length]();
    i++;
  }
}
loop();
</script>
